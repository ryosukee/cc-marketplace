schema_version: "1.1"
name: neg-04-edit-repo-rules
description: repo 直下 rules/ (.claude/ ではない) の編集依頼 (境界事例) で dotclaude-writer が発動しないか
tags: [trigger, negative, boundary]
plugins:
  - ../../../plugins/dotclaude-writer
context:
  scaffold_script: scaffold.sh
execution:
  prompt: rules/markdown-formatting.md の誤字を探して修正して
  max_turns: 4
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
runs: 3
graders:
  - type: tool_used
    name: skill-not-invoked
    tool: Skill
    input_match: dotclaude-writer
    min: 0
    max: 0
