schema_version: "1.1"
name: neg-08-propose-only
description: .claude/ 配下の編集を相談するだけ (実操作なし) の依頼で dotclaude-writer が発動しないか
tags: [trigger, negative, boundary]
plugins:
  - ../../../plugins/dotclaude-writer
context:
  scaffold_script: scaffold.sh
execution:
  prompt: .claude/rules/ のファイル構成をどう整理すべきか案を出して。まだ編集はしないで
  max_turns: 4
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: tool_used
    name: skill-not-invoked
    tool: Skill
    input_match: dotclaude-writer
    min: 0
    max: 0
