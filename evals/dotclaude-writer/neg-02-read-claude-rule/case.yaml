schema_version: "1.1"
name: neg-02-read-claude-rule
description: .claude/ 配下の読み取りだけの依頼 (境界事例) で dotclaude-writer が発動しないか
tags: [trigger, negative, boundary]
plugins:
  - ../../../plugins/dotclaude-writer
context:
  scaffold_script: scaffold.sh
execution:
  prompt: .claude/rules/coding.md を読んで要点を 3 行で教えて
  max_turns: 4
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: tool_used
    name: skill-not-invoked
    tool: Skill
    input_match: dotclaude-writer
    min: 0
    max: 0
