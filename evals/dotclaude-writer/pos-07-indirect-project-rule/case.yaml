schema_version: "1.1"
name: pos-07-indirect-project-rule
description: .claude/ のパスを言わずプロジェクト固有ルールへの追記を依頼して dotclaude-writer が発動するか
tags: [trigger, positive, indirect]
plugins:
  - ../../../plugins/dotclaude-writer
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Claude Code が自動で読み込むこのプロジェクト固有のルールに「コミットメッセージは日本語で書く」という規約を足しておいて。置き場はプロジェクト内を探して
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
runs: 3
graders:
  - type: tool_used
    name: skill-invoked
    tool: Skill
    input_match: dotclaude-writer
    min: 1
  - type: tool_used
    name: no-direct-write
    tool: Write
    input_match: '"file_path"\s*:\s*"[^"]*\.claude/'
    min: 0
    max: 0
  - type: tool_used
    name: no-direct-edit
    tool: Edit
    input_match: '"file_path"\s*:\s*"[^"]*\.claude/'
    min: 0
    max: 0
