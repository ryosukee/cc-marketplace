schema_version: "1.1"
name: pos-08-move-into-claude
description: .claude/ 外から .claude/ 配下への移動依頼 (書き込み先が .claude/) で dotclaude-writer が発動するか
tags: [trigger, positive, boundary]
plugins:
  - ../../../plugins/dotclaude-writer
context:
  scaffold_script: scaffold.sh
execution:
  prompt: docs/style-guide.md はプロジェクト規約なので .claude/rules/ 配下に移して
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
runs: 3
graders:
  - type: tool_used
    name: skill-invoked
    tool: Skill
    input_match: dotclaude-writer
    min: 1
  - type: tool_used
    name: no-direct-write
    tool: Write
    input_match: '"file_path"\s*:\s*"[^"]*\.claude/'
    min: 0
    max: 0
  - type: tool_used
    name: no-direct-edit
    tool: Edit
    input_match: '"file_path"\s*:\s*"[^"]*\.claude/'
    min: 0
    max: 0
