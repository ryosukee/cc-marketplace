schema_version: "1.1"
name: neg-06-claude-plugin-dir
description: .claude-plugin/ (.claude/ ではない名前隣接ディレクトリ) の編集依頼で dotclaude-writer が発動しないか
tags: [trigger, negative, boundary]
plugins:
  - ../../../plugins/dotclaude-writer
context:
  scaffold_script: scaffold.sh
execution:
  prompt: .claude-plugin/marketplace.json の各 plugin の description を確認して、誤字があれば直して
  max_turns: 4
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
runs: 3
graders:
  - type: tool_used
    name: skill-not-invoked
    tool: Skill
    input_match: dotclaude-writer
    min: 0
    max: 0
