text('[data-start-label]',states[start].label);text('[data-current-label]',states[current].label);text('[data-current-description]',states[current].description);

all('[data-action]').forEach(a=>{const enabled=a.dataset.from===current&&!states[current].final;a.setAttribute('aria-disabled',String(!enabled));a.setAttribute('tabindex',enabled?'0':'-1');a.setAttribute('aria-label',states[a.dataset.from].label+'から'+labels[a.dataset.action]+(a.dataset.action==='send'?'を'+(a.dataset.result==='accepted'?'成功（受理）':'失敗（拒否）')+'で試行':'を実行')+(enabled?'':'。現在は実行不可'));});
const last=history.at(-1);
all('[data-path-from]').forEach(p=>{p.dataset.enabled=String(p.dataset.pathFrom===current&&!states[current].final);p.dataset.latest=String(Boolean(last&&last.from===p.dataset.pathFrom&&last.action===p.dataset.pathAction&&(p.dataset.pathResult==='stem'||last.response===p.dataset.pathResult)));});

const rows=$('[data-sequence-rows]');rows.replaceChildren();
const first=el('li','rsv-record');first.dataset.kind='start';const startLine=el('div','rsv-caption');startLine.append(el('span','','開始 · '+states[start].label));first.append(startLine);if(!history.length){const p=el('p','rsv-local');p.append(el('span','','まだ通知送信も予約取り消しも実行していません。'));first.append(p);}rows.append(first);
history.forEach((step,index)=>{const row=el('li','rsv-record');Object.assign(row.dataset,{kind:'action',recordAction:step.action,from:step.from,to:step.to,recordResponse:step.response,step:String(index+1)});const cap=el('div','rsv-caption');cap.append(el('span','',(index+1)+' · '+labels[step.action]+' · '+step.result),el('span','',states[step.from].label+' → '+states[step.to].label));row.append(cap);if(step.action==='cancel'){const p=el('p','rsv-local');p.append(el('span','','対外通信なし · 予約管理内で取消を記録'));row.append(p);}else{['通知送信要求',step.response==='accepted'?'受理応答':'拒否応答'].forEach((label,i)=>{const msg=el('div','rsv-message');Object.assign(msg.dataset,{message:String(i+1),fromActor:i===0?'予約管理':'通知サービス',toActor:i===0?'通知サービス':'予約管理'});msg.setAttribute('aria-label',msg.dataset.fromActor+'から'+msg.dataset.toActor+'へ：'+label);const wire=el('span','rsv-message-wire');wire.dataset.direction=i===0?'forward':'back';wire.setAttribute('aria-hidden','true');msg.append(el('span','rsv-message-text',label),wire);row.append(msg);});}rows.append(row);});
text('[data-sequence-count]','実行 '+history.length+' 回 · 通信 '+history.filter(s=>s.action==='send').length*2+' 件');
};
const activate=c=>{
if(c.matches('[data-reset-initial]')){start=initial;current=initial;history=[];render();return;}
if(c.matches('[data-layout-option]')){root.dataset.layout=c.dataset.layoutOption;all('[data-layout-option]').forEach(b=>b.setAttribute('aria-pressed',String(b===c)));return;}
if(c.matches('[data-node-state]')){start=c.dataset.nodeState;current=start;history=[];render();return;}
if(c.getAttribute('aria-disabled')==='true'||c.dataset.from!==current||states[current].final)return;
const action=c.dataset.action;if(!['send','cancel'].includes(action))return;
const response=action==='send'?c.dataset.result:'local';if(action==='send'&&!['accepted','rejected'].includes(response))return;
const from=current,to=action==='cancel'?'cancelled':response==='accepted'?'notified':'failed',result=action==='cancel'?'取消完了':response==='accepted'?'成功（受理）':'失敗（拒否）';
history.push({from,to,action,response,result});current=to;render();
if(!reduced.matches){const n=$('[data-node-state="'+current+'"]');n.classList.remove('rsv-flash');void n.getBoundingClientRect();n.classList.add('rsv-flash');}
};
const selector='[data-node-state],[data-action],[data-layout-option],[data-reset-initial]';
root.addEventListener('click',event=>{event.stopPropagation();const c=event.target.closest(selector);if(!c||!root.contains(c))return;event.preventDefault();activate(c);});
root.addEventListener('keydown',event=>{event.stopPropagation();if(!['Enter',' '].includes(event.key)||event.repeat)return;const c=event.target.closest(selector);if(!c||!root.contains(c))return;event.preventDefault();activate(c);});
root.addEventListener('animationend',event=>{if(event.animationName==='rsv14-emphasis')event.target.closest('.rsv-node')?.classList.remove('rsv-flash');});
reduced.addEventListener('change',()=>{if(reduced.matches)all('.rsv-flash').forEach(n=>n.classList.remove('rsv-flash'));});
for(const kind of ['input','change','keyup'])root.addEventListener(kind,event=>event.stopPropagation());
render();
});
};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
})();

</script>

<svg style="display:none" xmlns="http://www.w3.org/2000/svg"><defs><marker id="pattern-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"></path></marker></defs></svg>
<template data-fig="chart-patterns"><div class="chart-patterns"><section class="chart-pattern"><h3>処理順と条件の分岐</h3><svg viewBox="0 0 360 220" role="img" aria-label="図法の見本" xmlns="http://www.w3.org/2000/svg"><rect class="box" x="122" y="8" width="116" height="34" rx="0"></rect><text x="180.0" y="30.0">入力を検証</text><path class="line" d="M180 42V66"></path><path class="box" d="M180 66L216 98L180 130L144 98Z"></path><text x="180" y="103">妥当？</text><path class="line" d="M144 98H76V170"></path><path class="line" d="M216 98H284V170"></path><text x="76" y="142">はい</text><text x="284" y="142">いいえ</text><rect class="box" x="22" y="170" width="108" height="34" rx="0"></rect><text x="76.0" y="192.0">登録</text><rect class="box" x="230" y="170" width="108" height="34" rx="0"></rect><text x="284.0" y="192.0">修正を案内</text></svg><p>処理を順に追うフローチャート。処理は矩形、判断は菱形にする。状態として何を保持するかを示す図とは分ける。</p></section><section class="chart-pattern"><h3>同じ操作の結果で状態が分かれる</h3><svg viewBox="0 0 360 220" role="img" aria-label="図法の見本" xmlns="http://www.w3.org/2000/svg"><rect class="box" x="122" y="8" width="116" height="38" rx="7"></rect><text x="180.0" y="32.0">予約済み</text><path class="line" d="M180 46V100H76V168"></path><path class="line" d="M180 100H284V168"></path><text x="180" y="80">通知送信</text><text x="76" y="140">受理</text><text x="284" y="140">拒否</text><rect class="box" x="18" y="168" width="116" height="38" rx="7"></rect><text x="76.0" y="192.0">通知済み</text><rect class="box" x="226" y="168" width="116" height="38" rx="7"></rect><text x="284.0" y="192.0">通知失敗</text></svg><p>業務状態をノード、操作と結果を矢印に置く状態図。上の予約例では、この分岐に再送信と取り消しを組み合わせている。</p></section><section class="chart-pattern"><h3>同じ状態へ戻る再試行</h3><svg viewBox="0 0 360 220" role="img" aria-label="図法の見本" xmlns="http://www.w3.org/2000/svg"><rect class="box" x="16" y="130" width="124" height="42" rx="7"></rect><text x="78.0" y="156.0">通知失敗</text><rect class="box" x="224" y="130" width="120" height="42" rx="7"></rect><text x="284.0" y="156.0">通知済み</text><path class="line" d="M140 151H224"></path><text x="182" y="122">再送・受理</text><path class="line" d="M46 130V48H110V130"></path><text x="78" y="30">再送・拒否</text></svg><p>再送信が失敗して同じ状態へ戻る場合、自己ループを外側へ出す。状態が変わらなくても、試行を履歴に残す。</p></section><section class="chart-pattern"><h3>相互に切り替わる状態</h3><svg viewBox="0 0 360 220" role="img" aria-label="図法の見本" xmlns="http://www.w3.org/2000/svg"><rect class="box" x="16" y="94" width="124" height="42" rx="7"></rect><text x="78.0" y="120.0">稼働中</text><rect class="box" x="224" y="94" width="120" height="42" rx="7"></rect><text x="284.0" y="120.0">一時停止中</text><path class="line" d="M140 106H224"></path><text x="182" y="88">一時停止</text><path class="line" d="M224 126H140"></path><text x="182" y="160">再開</text></svg><p>往復する状態を並べ、方向ごとに線とイベントを分ける。上下の進行順を無理に与えず、戻る関係を読める配置にする。</p></section><section class="chart-pattern"><h3>親状態の中にある状態</h3><svg viewBox="0 0 360 220" role="img" aria-label="図法の見本" xmlns="http://www.w3.org/2000/svg"><rect class="boundary" x="14" y="20" width="332" height="184" rx="10"></rect><text x="180" y="45">稼働中</text><rect class="box" x="34" y="100" width="110" height="42" rx="7"></rect><text x="89.0" y="126.0">待機</text><rect class="box" x="216" y="100" width="110" height="42" rx="7"></rect><text x="271.0" y="126.0">処理中</text><path class="line" d="M144 112H216"></path><text x="180" y="90">開始</text><path class="line" d="M216 132H144"></path><text x="180" y="169">完了</text></svg><p>親の稼働中に属する待機・処理中を、親の枠内に置く階層状態図。単に関連項目を囲む枠とは区別する。</p></section><section class="chart-pattern"><h3>同時に有効な複数の状態軸</h3><svg viewBox="0 0 360 220" role="img" aria-label="図法の見本" xmlns="http://www.w3.org/2000/svg"><rect class="boundary" x="14" y="20" width="332" height="184" rx="10"></rect><text x="180" y="45">動作中</text><path class="boundary" d="M180 60V204" stroke-dasharray="5 4"></path><text x="94" y="86">通信</text><text x="266" y="86">保存</text><rect class="box" x="34" y="112" width="120" height="42" rx="7"></rect><text x="94.0" y="138.0">接続中</text><rect class="box" x="206" y="112" width="120" height="42" rx="7"></rect><text x="266.0" y="138.0">未保存</text></svg><p>通信と保存など、同時に有効な状態を領域で分ける並行状態図。成功か失敗かという択一の分岐には使わない。</p></section></div></template>
