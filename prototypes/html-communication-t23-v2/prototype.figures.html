    };
    const transitions = { scheduled: { due: 'sending', cancel: 'cancelled' }, sending: { ok: 'sent', fail: 'failed' }, failed: { retry: 'sending', cancel: 'cancelled' }, sent: {}, cancelled: {} };
    const events = { due: { label: '指定時刻に進める', requirement: '予約中で実行できます' }, ok: { label: '成功を返す', requirement: '送信中で実行できます' }, fail: { label: '失敗を返す', requirement: '送信中で実行できます' }, retry: { label: '再試行する', requirement: '失敗で実行できます' }, cancel: { label: '取り消す', requirement: '予約中・失敗で実行できます' } };
    const actors = ['予約管理', '送信処理', '配信先'];
    const messages = {
      due: [{ from: 0, to: 1, text: '送信を依頼' }, { from: 1, to: 2, text: '通知を送る' }],
      ok: [{ from: 2, to: 1, text: '受理を返す' }, { from: 1, to: 0, text: '送信済みを記録' }],
      fail: [{ from: 2, to: 1, text: '失敗を返す' }, { from: 1, to: 0, text: '失敗を記録' }],
      retry: [{ from: 0, to: 1, text: '送信を再依頼' }, { from: 1, to: 2, text: '通知を送る' }],
      cancel: [{ from: 0, to: 1, text: '取消を通知' }]
    };
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
    document.querySelectorAll('.sti[data-demo="state-redesign"]').forEach((root) => {
      if (root.dataset.initialized) return;
      root.dataset.initialized = 'true';
      let viewState = 'scheduled';
      let trialState = 'scheduled';
      let history = [];
      const find = (selector) => root.querySelector(selector);
      const all = (selector) => Array.from(root.querySelectorAll(selector));
      const node = (tag, className, text) => { const element = document.createElement(tag); if (className) element.className = className; if (text !== undefined) element.textContent = text; return element; };
      const setText = (selector, text) => { find(selector).textContent = text; };
      const flash = (element) => { if (!element || reduced.matches) return; element.classList.remove('sti-flash'); void element.offsetWidth; element.classList.add('sti-flash'); };
      const renderView = () => {
        root.dataset.viewState = viewState;
        all('[data-action="browse"]').forEach((button) => { const selected = button.dataset.state === viewState; button.setAttribute('aria-pressed', String(selected)); button.querySelector('[data-selected-mark]').hidden = !selected; });
        setText('[data-view-label]', states[viewState].label);
        setText('[data-view-description]', states[viewState].description);
        setText('[data-view-next]', states[viewState].next);
      };
      const renderTrial = () => {
        root.dataset.trialState = trialState;
        setText('[data-trial-label]', states[trialState].label + (states[trialState].final ? ' · 終端' : ''));
        setText('[data-trial-description]', states[trialState].description);
        all('[data-action="event"]').forEach((button) => {
          const event = button.dataset.event;
          const enabled = Object.hasOwn(transitions[trialState], event);
          button.disabled = !enabled;
          const reason = enabled ? '実行できます' : states[trialState].final ? '終端のため実行できません' : events[event].requirement;
          root.querySelector('[data-event-row="' + event + '"] [data-event-reason]').textContent = reason;
          button.setAttribute('aria-label', button.textContent.replace('▶', '').trim() + '。' + reason);
        });
        setText('[data-terminal-note]', states[trialState].final ? '試行は終了しました。別のイベント順を試すときは、試行履歴をリセットします。' : '淡いボタンは、この現在状態では実行できません。');
        find('[data-action="reset"]').disabled = history.length === 0;
      };
      const renderResults = () => {
        const sequence = find('[data-sequence-rows]');
        sequence.replaceChildren();
        if (!history.length) sequence.append(node('p', 'sti-sequence-empty', 'まだ通信はありません。「指定時刻に進める」か「取り消す」を実行すると、通信を表示します。'));
        let count = 0;
        history.forEach((step, index) => {
          const group = node('div', 'sti-seq-group');
          group.dataset.occurrence = String(index + 1);
          group.dataset.event = step.event;
          group.dataset.latest = String(index === history.length - 1);
          const heading = node('div', 'sti-seq-event');
          heading.append(node('span', '', String(index + 1) + ' · ' + events[step.event].label));
          if (index === history.length - 1) heading.append(node('span', 'sti-latest-tag', '直前に実行'));
          group.append(heading);
          messages[step.event].forEach((message, messageIndex) => {
            count += 1;
            const row = node('div', 'sti-seq-row');
            row.dataset.message = step.event + '-' + String(messageIndex + 1);
            const left = (Math.min(message.from, message.to) * 100 / 3 + 100 / 6) + '%';
            const right = (100 - (Math.max(message.from, message.to) * 100 / 3 + 100 / 6)) + '%';
            row.style.setProperty('--sti-left', left);
            row.style.setProperty('--sti-right', right);
            const label = node('span', 'sti-msg', message.text);
            label.setAttribute('aria-hidden', 'true');
            const wire = node('span', 'sti-wire');
            wire.dataset.direction = message.to > message.from ? 'forward' : 'back';
            wire.setAttribute('aria-hidden', 'true');
            row.append(label, wire, node('span', 'sti-sr', '通信 ' + String(count) + '：' + actors[message.from] + 'から' + actors[message.to] + 'へ、' + message.text + '。'));
            group.append(row);
          });
          sequence.append(group);
        });
        setText('[data-sequence-count]', String(history.length) + ' 回のイベント · ' + String(count) + ' 件の通信');
        const route = find('[data-route]');
        route.replaceChildren();
        const addRoute = (step, index) => {
          const current = index === history.length;
          const row = node('li', 'sti-route-row');
          row.dataset.current = String(current);
          row.dataset.step = String(index);
          row.append(node('span', 'sti-route-kicker', index === 0 ? '開始' : String(index) + ' 回目'));
          if (step) row.append(node('span', 'sti-route-event', '実行：' + events[step.event].label));
          const state = node('span', 'sti-route-state', (step ? '到達：' : '') + states[step ? step.to : 'scheduled'].label);
          if (current) state.append(node('span', 'sti-route-current', '現在'));
          row.append(state);
          route.append(row);
        };
        addRoute(null, 0);
        history.forEach((step, index) => addRoute(step, index + 1));
        setText('[data-route-note]', history.length ? '各行の「実行」がイベント、「到達」がその後の状態です。' : 'まだイベントを実行していません。');
      };
      root.addEventListener('click', (event) => {
        const button = event.target.closest('button[data-action]');
        if (!button || !root.contains(button) || button.disabled) return;
        if (button.dataset.action === 'browse') {
          const state = button.dataset.state;
          if (!Object.hasOwn(states, state)) return;
          viewState = state;
          renderView();
          flash(find('.sti-view-detail'));
          return;
        }
        if (button.dataset.action === 'event') {
          const key = button.dataset.event;
          if (!Object.hasOwn(transitions[trialState], key)) return;
          const destination = transitions[trialState][key];
          history.push({ event: key, from: trialState, to: destination });
          trialState = destination;
          renderTrial();
          renderResults();
          setText('[data-result-announcement]', events[key].label + 'を実行しました。試行の現在は' + states[trialState].label + '。閲覧対象は' + states[viewState].label + 'のままです。');
          flash(find('[data-trial-current]'));
          flash(find('.sti-seq-group[data-latest="true"]'));
          return;
        }
        if (button.dataset.action === 'reset') {
          history = [];
          trialState = 'scheduled';
          renderTrial();
          renderResults();
          all('.sti-flash').forEach((element) => element.classList.remove('sti-flash'));
          setText('[data-result-announcement]', '試行履歴をリセットしました。試行の現在は予約中。閲覧対象は' + states[viewState].label + 'のままです。');
        }
      });
      root.addEventListener('animationend', (event) => { if (event.animationName === 'sti-emphasis') event.target.classList.remove('sti-flash'); });
      reduced.addEventListener('change', () => { if (reduced.matches) all('.sti-flash').forEach((element) => element.classList.remove('sti-flash')); });
      renderView();
      renderTrial();
      renderResults();
    });
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init, { once: true });
  else init();
})();
</script>
