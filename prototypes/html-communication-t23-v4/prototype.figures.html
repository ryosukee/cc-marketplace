t="cancel"><path d="M100 140V245"/><text x="155" y="199" text-anchor="middle">取り消す</text></g><g class="stx-edge" data-edge-from="failed" data-edge-event="cancel" data-from="failed" data-to="cancelled" data-event="cancel"><path d="M280 285H160"/><text x="220" y="269" text-anchor="middle">取り消す</text></g><g class="stx-node" data-node-state="scheduled"><rect class="stx-node-box" x="40" y="60" width="120" height="80" rx="10"/><text class="stx-node-name" x="100" y="87" text-anchor="middle">予約中</text><text class="stx-node-status" data-node-status x="100" y="108" text-anchor="middle"></text></g><g class="stx-node" data-node-state="sending"><rect class="stx-node-box" x="280" y="60" width="120" height="80" rx="10"/><text class="stx-node-name" x="340" y="87" text-anchor="middle">送信中</text><text class="stx-node-status" data-node-status x="340" y="108" text-anchor="middle"></text></g><g class="stx-node" data-node-state="sent"><rect class="stx-node-box" x="520" y="60" width="120" height="80" rx="10"/><text class="stx-node-name" x="580" y="87" text-anchor="middle">送信済み</text><text class="stx-node-status" data-node-status x="580" y="108" text-anchor="middle"></text></g><g class="stx-node" data-node-state="failed"><rect class="stx-node-box" x="280" y="245" width="120" height="80" rx="10"/><text class="stx-node-name" x="340" y="272" text-anchor="middle">失敗</text><text class="stx-node-status" data-node-status x="340" y="293" text-anchor="middle"></text></g><g class="stx-node" data-node-state="cancelled"><rect class="stx-node-box" x="40" y="245" width="120" height="80" rx="10"/><text class="stx-node-name" x="100" y="272" text-anchor="middle">取消済み</text><text class="stx-node-status" data-node-status x="100" y="293" text-anchor="middle"></text></g></svg></div><p class="stx-map-instruction">矢印はイベントによる遷移です。図は読み取り専用。↔ 狭い画面では横にスクロールできます。</p>

const init=()=>{
const states={scheduled:{label:'予約中',description:'指定した時刻を待っています。指定時刻に進めるか、取り消すことができます。'},sending:{label:'送信中',description:'通知の送信結果を待っています。成功か失敗を返すことができます。'},sent:{label:'送信済み',description:'配信先が通知を受理しました。終端のため、次のイベントはありません。',final:true},failed:{label:'失敗',description:'送信に失敗しました。再試行して送信中へ戻るか、取り消すことができます。'},cancelled:{label:'取消済み',description:'予約を取り消しました。以後は通知を送信しません。終端のため、次のイベントはありません。',final:true}};
const transitions={scheduled:{due:'sending',cancel:'cancelled'},sending:{ok:'sent',fail:'failed'},failed:{retry:'sending',cancel:'cancelled'},sent:{},cancelled:{}};
const events={due:{label:'指定時刻に進める',requirement:'予約中で実行できます'},ok:{label:'成功を返す',requirement:'送信中で実行できます'},fail:{label:'失敗を返す',requirement:'送信中で実行できます'},retry:{label:'再試行する',requirement:'失敗で実行できます'},cancel:{label:'取り消す',requirement:'予約中または失敗で実行できます'}};
const messages={due:[{from:0,to:1,text:'送信を依頼'},{from:1,to:2,text:'通知を送る'}],ok:[{from:2,to:1,text:'受理を返す'},{from:1,to:0,text:'送信済みを記録'}],fail:[{from:2,to:1,text:'失敗を返す'},{from:1,to:0,text:'失敗を記録'}],retry:[{from:0,to:1,text:'送信を再依頼'},{from:1,to:2,text:'通知を送る'}],cancel:[{from:0,to:1,text:'取消を通知'}]};
const actors=['予約管理','送信処理','配信先'];
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)');

document.querySelectorAll('.stx[data-demo="state-transition"]').forEach(root=>{
if(root.dataset.initialized)return;root.dataset.initialized='true';
let currentState='scheduled',history=[];
const find=s=>root.querySelector(s),all=s=>Array.from(root.querySelectorAll(s));
const node=(tag,cls,text)=>{const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el;};
const setText=(s,text)=>{find(s).textContent=text;};
const flash=el=>{if(!el||reduced.matches)return;el.classList.remove('stx-flash');void el.getBoundingClientRect();el.classList.add('stx-flash');};
const renderCurrent=()=>{
root.dataset.currentState=currentState;
all('[data-action="state"]').forEach(b=>{const selected=b.dataset.state===currentState;b.setAttribute('aria-pressed',String(selected));b.setAttribute('aria-label',states[b.dataset.state].label+(selected?'。現在の状態':'に直接切り替える'));});
setText('[data-current-label]',states[currentState].label+(states[currentState].final?'（終端）':''));setText('[data-current-description]',states[currentState].description);
all('[data-action="event"]').forEach(b=>{const key=b.dataset.event,enabled=Object.hasOwn(transitions[currentState],key);b.disabled=!enabled;const reason=enabled?'実行できます':states[currentState].final?'終端のため実行できません':events[key].requirement;b.title=reason;b.setAttribute('aria-label',events[key].label+'。'+reason);});
setText('[data-terminal-note]',states[currentState].final?'終端のためイベントは実行できません。状態名を選ぶと、別の状態から試せます。':'青いボタンで矢印に沿って進みます。状態名を選ぶと、通信せず直接切り替わります。');find('[data-action="reset"]').disabled=!history.length;
const reached=new Set(['scheduled',...history.map(step=>step.to)]);
all('[data-node-state]').forEach(g=>{const key=g.dataset.nodeState;g.dataset.current=String(key===currentState);g.dataset.reached=String(reached.has(key));g.querySelector('[data-node-status]').textContent=key===currentState?'● 現在'+(states[key].final?' · 終端':''):reached.has(key)?'履歴あり'+(states[key].final?' · 終端':''):states[key].final?'終端':'未操作';});
const last=history.at(-1);all('[data-edge-event]').forEach(g=>g.dataset.latest=String(Boolean(last&&last.kind==='event'&&g.dataset.edgeFrom===last.from&&g.dataset.edgeEvent===last.event)));
find('.stx-map').setAttribute('aria-label','予約通知の状態遷移図。現在は'+states[currentState].label+'。'+(last?.kind==='state'?'状態の直接切替では矢印を通りません。':''));
};
const renderResults=()=>{
const sequence=find('[data-sequence-rows]');sequence.parentElement.dataset.empty=String(!history.some(s=>s.kind==='event'));sequence.replaceChildren();let count=0,eventCount=0;
if(!history.length)sequence.append(node('p','stx-empty','まだ通信はありません。イベントを実行すると、ここに通信が追加されます。'));
history.forEach((step,index)=>{
if(step.kind==='state'){const row=node('div','stx-seq-break');row.dataset.kind='state';row.dataset.state=step.to;row.dataset.occurrence=String(index+1);row.dataset.latest=String(index===history.length-1);row.append(node('strong','',String(index+1)+' · 状態を選択：'+states[step.to].label),node('small','','通信なし · ここから別の状態で続けます'));sequence.append(row);return;}
eventCount++;const group=node('div','stx-seq-group');group.dataset.kind='event';group.dataset.occurrence=String(index+1);group.dataset.event=step.event;group.dataset.latest=String(index===history.length-1);const heading=node('div','stx-seq-event');heading.append(node('span','',String(index+1)+' · '+events[step.event].label));if(index===history.length-1)heading.append(node('span','stx-latest-tag','直前に実行'));group.append(heading);
messages[step.event].forEach((message,mi)=>{count++;const row=node('div','stx-seq-row');row.dataset.message=step.event+'-'+String(mi+1);row.style.setProperty('--stx-left',String(Math.min(message.from,message.to)*100/3+100/6)+'%');row.style.setProperty('--stx-right',String(100-(Math.max(message.from,message.to)*100/3+100/6))+'%');const label=node('span','stx-msg',message.text),wire=node('span','stx-wire');label.setAttribute('aria-hidden','true');wire.setAttribute('aria-hidden','true');wire.dataset.direction=message.to>message.from?'forward':'back';row.append(label,wire,node('span','stx-sr',actors[message.from]+'から'+actors[message.to]+'へ、'+message.text+'。'));group.append(row);});sequence.append(group);
});setText('[data-sequence-count]',eventCount+' 回のイベント · '+count+' 件の通信');
const route=find('[data-route]');route.replaceChildren();const addRoute=(step,index)=>{const row=node('li','stx-route-row');row.dataset.current=String(index===history.length);row.dataset.step=String(index);row.dataset.kind=step?step.kind:'initial';row.dataset.state=step?step.to:'scheduled';const action=!step?'初期状態':step.kind==='state'?String(index)+' · 状態を選択：'+states[step.to].label:String(index)+' · イベント：'+events[step.event].label+' →';row.append(node('span','stx-route-event',action));const state=node('span','stx-route-state',states[step?step.to:'scheduled'].label);if(index===history.length)state.append(node('span','stx-route-current','● 現在'));row.append(state);route.append(row);};addRoute(null,0);history.forEach((step,index)=>addRoute(step,index+1));setText('[data-route-note]',history.length?'操作履歴の最後の行が現在の状態です。':'まだ操作していません。');
if(history.length){route.scrollTop=route.scrollHeight;const viewport=find('.stx-sequence-viewport');viewport.scrollTop=viewport.scrollHeight;}
};
const render=()=>{renderCurrent();renderResults();};
root.addEventListener('click',event=>{
const button=event.target.closest('button[data-action]');if(!button||!root.contains(button)||button.disabled)return;
if(button.dataset.action==='state'){const to=button.dataset.state;if(!Object.hasOwn(states,to)||to===currentState)return;history.push({kind:'state',from:currentState,to});currentState=to;render();setText('[data-result-announcement]','状態を直接選択しました。現在は'+states[currentState].label+'。通信は発生していません。');}
else if(button.dataset.action==='event'){const key=button.dataset.event;if(!Object.hasOwn(transitions[currentState],key))return;const to=transitions[currentState][key];history.push({kind:'event',from:currentState,event:key,to});currentState=to;render();setText('[data-result-announcement]',events[key].label+'を実行。現在は'+states[currentState].label+'。実行したイベントを操作履歴に、その通信を通信のシーケンスに追加しました。');}
else if(button.dataset.action==='reset'){history=[];currentState='scheduled';render();all('.stx-flash').forEach(el=>el.classList.remove('stx-flash'));setText('[data-result-announcement]','予約中に戻し、履歴と通信を消去しました。');return;}
else return;
flash(find('[data-current-description-panel]'));flash(find('[data-node-state="'+currentState+'"] .stx-node-box'));flash(find('[data-sequence-rows] [data-latest="true"]'));
});
root.addEventListener('animationend',event=>{if(event.animationName==='stx-emphasis')event.target.classList.remove('stx-flash');});reduced.addEventListener('change',()=>{if(reduced.matches)all('.stx-flash').forEach(el=>el.classList.remove('stx-flash'));});render();
});
};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
})();
</script>
