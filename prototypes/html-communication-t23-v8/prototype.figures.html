<header class="stx-top"><h3>予約通知の状態遷移</h3><p class="stx-lead">イベントを実行して、状態と通信の変化を確認できます。</p></header>

ed" data-edge-event="cancel" data-from="failed" data-to="cancelled" data-event="cancel"><path d="M280 285H160"/><text x="220" y="269" text-anchor="middle">取り消す</text></g><g class="stx-node" data-node-state="scheduled"><rect class="stx-node-box" x="40" y="60" width="120" height="80" rx="10"/><text class="stx-node-name" x="100" y="87" text-anchor="middle">予約中</text><text class="stx-node-status" data-node-status x="100" y="108" text-anchor="middle"></text></g><g class="stx-node" data-node-state="sending"><rect class="stx-node-box" x="280" y="60" width="120" height="80" rx="10"/><text class="stx-node-name" x="340" y="87" text-anchor="middle">送信中</text><text class="stx-node-status" data-node-status x="340" y="108" text-anchor="middle"></text></g><g class="stx-node" data-node-state="sent"><rect class="stx-node-box" x="520" y="60" width="120" height="80" rx="10"/><text class="stx-node-name" x="580" y="87" text-anchor="middle">送信済み</text><text class="stx-node-status" data-node-status x="580" y="108" text-anchor="middle"></text></g><g class="stx-node" data-node-state="failed"><rect class="stx-node-box" x="280" y="245" width="120" height="80" rx="10"/><text class="stx-node-name" x="340" y="272" text-anchor="middle">失敗</text><text class="stx-node-status" data-node-status x="340" y="293" text-anchor="middle"></text></g><g class="stx-node" data-node-state="cancelled"><rect class="stx-node-box" x="40" y="245" width="120" height="80" rx="10"/><text class="stx-node-name" x="100" y="272" text-anchor="middle">取消済み</text><text class="stx-node-status" data-node-status x="100" y="293" text-anchor="middle"></text></g></svg></div><p class="stx-map-instruction">図は読み取り専用です。狭い画面では横にスクロールできます。</p></section>
<section class="stx-bottom" aria-label="操作と通信の履歴"><h4>操作と通信の履歴</h4><p class="stx-record-intro">横罫線の注釈は、イベント実行前と実行後の状態を示します。</p><div class="stx-timeline" data-timeline><div class="stx-actor-row" role="group" aria-label="通信の参加者"><span>予約管理</span><span>送信処理</span><span>配信先</span></div><ol class="stx-records" data-sequence-rows aria-label="実行順のイベントと通信"></ol></div><p class="stx-count" data-sequence-count></p></section></div></template>
<script data-scope="figures">
(() => {
'use strict';
const init=()=>{
const states={scheduled:{label:'予約中',description:'通知の送信予定時刻を待っています。指定時刻に進めるか、取り消すことができます。'},sending:{label:'送信中',description:'通知の送信結果を待っています。成功か失敗を返すことができます。'},sent:{label:'送信済み',description:'配信先が通知を受理しました。終端のため、次のイベントはありません。',final:true},failed:{label:'失敗',description:'送信に失敗しました。再試行して送信中へ戻るか、取り消すことができます。'},cancelled:{label:'取消済み',description:'予約を取り消しました。以後は通知を送信しません。終端のため、次のイベントはありません。',final:true}};
const transitions={scheduled:{due:'sending',cancel:'cancelled'},sending:{ok:'sent',fail:'failed'},failed:{retry:'sending',cancel:'cancelled'},sent:{},cancelled:{}};
const events={due:{label:'指定時刻に進める',requirement:'予約中で実行できます'},ok:{label:'成功を返す',requirement:'送信中で実行できます'},fail:{label:'失敗を返す',requirement:'送信中で実行できます'},retry:{label:'再試行する',requirement:'失敗で実行できます'},cancel:{label:'取り消す',requirement:'予約中または失敗で実行できます'}};
const messages={due:[{from:0,to:1,text:'送信を依頼'},{from:1,to:2,text:'通知を送る'}],ok:[{from:2,to:1,text:'受理を返す'},{from:1,to:0,text:'送信済みを記録'}],fail:[{from:2,to:1,text:'失敗を返す'},{from:1,to:0,text:'失敗を記録'}],retry:[{from:0,to:1,text:'送信を再依頼'},{from:1,to:2,text:'通知を送る'}],cancel:[{from:0,to:1,text:'取消を通知'}]};
const actors=['予約管理','送信処理','配信先'];
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)');


document.querySelectorAll('.stx[data-demo="state-transition"]').forEach(root=>{
if(root.dataset.initialized)return;root.dataset.initialized='true';
let initialState='scheduled',currentState=initialState,history=[];
const find=s=>root.querySelector(s),all=s=>Array.from(root.querySelectorAll(s));
const node=(tag,cls,text)=>{const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el;};
const setText=(s,text)=>{find(s).textContent=text;};
const flash=el=>{if(!el||reduced.matches)return;el.classList.remove('stx-flash');void el.getBoundingClientRect();el.classList.add('stx-flash');};
const renderCurrent=()=>{
root.dataset.initialState=initialState;root.dataset.currentState=currentState;
setText('[data-current-label]',states[currentState].label+(states[currentState].final?'（終端）':''));setText('[data-current-description]',states[currentState].description);
all('[data-action="event"]').forEach(b=>{const key=b.dataset.event,enabled=Object.hasOwn(transitions[currentState],key);b.disabled=!enabled;const reason=enabled?'実行できます':states[currentState].final?'終端のため実行できません':events[key].requirement;b.title=reason;b.setAttribute('aria-label',events[key].label+'。'+reason);});
find('[data-action="reset"]').disabled=!history.length;
const reached=new Set([initialState,...history.map(step=>step.to)]);
all('[data-node-state]').forEach(g=>{const key=g.dataset.nodeState;g.dataset.current=String(key===currentState);g.dataset.reached=String(reached.has(key));g.querySelector('[data-node-status]').textContent=key===currentState?'● 現在'+(states[key].final?'・終端':''):reached.has(key)?'履歴あり'+(states[key].final?'・終端':''):states[key].final?'終端':'未操作';});
const last=history.at(-1);all('[data-edge-event]').forEach(g=>g.dataset.latest=String(Boolean(last&&g.dataset.edgeFrom===last.from&&g.dataset.edgeEvent===last.event)));
find('.stx-map').setAttribute('aria-label','予約通知の状態遷移図。初期状態は'+states[initialState].label+'。現在は'+states[currentState].label+'。');
};
const renderResults=()=>{
const records=find('[data-sequence-rows]');records.replaceChildren();let count=0,eventCount=0;
const makeRecord=(step,index)=>{
const row=node('li','stx-record'),current=index===history.length;
row.dataset.kind=step?step.kind:'initial';row.dataset.step=String(index);row.dataset.occurrence=String(index);row.dataset.state=step?step.to:initialState;row.dataset.from=step?step.from:initialState;row.dataset.to=step?step.to:initialState;row.dataset.event=step?.event||'';row.dataset.current=String(current);row.dataset.latest=String(current);if(current)row.id='stx8-current-record';
if(!step){
const divider=node('div','stx-divider'),text=node('span','');
text.append(node('strong','','初期状態 · '+states[initialState].label),document.createTextNode(' · 通信なし'));
if(current)text.append(node('span','stx-latest-mark',' · 最新'));divider.append(text);row.append(divider);
if(!step&&!history.length){const empty=node('p','stx-sequence-empty');empty.append(node('span','','イベントを実行すると通信が表示されます。'));row.append(empty);}return row;
}
eventCount++;
const caption=node('div','stx-event-caption');caption.append(node('span','stx-record-title',index+' · '+events[step.event].label),node('span','stx-record-state',states[step.from].label+' → '+states[step.to].label));if(current)caption.append(node('span','stx-latest-mark','● 最新'));row.append(caption);
const content=node('div','stx-event-content');content.setAttribute('role','group');content.setAttribute('aria-label',events[step.event].label+'の通信。区間前は'+states[step.from].label+'、区間後は'+states[step.to].label+'。');
messages[step.event].forEach((message,mi)=>{count++;const msg=node('div','stx-message');msg.dataset.message=step.event+'-'+String(mi+1);msg.dataset.fromActor=actors[message.from];msg.dataset.toActor=actors[message.to];const left=Math.min(message.from,message.to)*100/3+100/6,right=100-(Math.max(message.from,message.to)*100/3+100/6);msg.style.setProperty('--stx-left',String(left)+'%');msg.style.setProperty('--stx-right',String(right)+'%');msg.style.setProperty('--stx-mid',String((left+100-right)/2)+'%');const label=node('span','stx-message-text',message.text),wire=node('span','stx-message-wire');label.setAttribute('aria-hidden','true');wire.setAttribute('aria-hidden','true');wire.dataset.direction=message.to>message.from?'forward':'back';msg.append(label,wire,node('span','stx-sr','通信'+String(count)+'：'+actors[message.from]+'から'+actors[message.to]+'へ、'+message.text+'。'));content.append(msg);});
row.append(content);return row;
};records.append(makeRecord(null,0));history.forEach((step,index)=>records.append(makeRecord(step,index+1)));setText('[data-sequence-count]',eventCount+' 回のイベント · '+count+' 件の通信');
};

const render=()=>{renderCurrent();renderResults();};
const reset=()=>{history=[];currentState=initialState;all('.stx-flash').forEach(el=>el.classList.remove('stx-flash'));render();};
find('[data-initial-state]').addEventListener('change',event=>{event.stopPropagation();if(!Object.hasOwn(states,event.target.value))return;initialState=event.target.value;reset();setText('[data-operation-result]',states[initialState].label+'から開始します。');});
root.addEventListener('input',event=>event.stopPropagation());
root.addEventListener('click',event=>{
const button=event.target.closest('button[data-action]');if(!button||!root.contains(button)||button.disabled)return;
if(button.dataset.action==='reset'){reset();setText('[data-operation-result]',states[initialState].label+'に戻しました。');return;}
if(button.dataset.action!=='event')return;
const key=button.dataset.event;if(!Object.hasOwn(transitions[currentState],key))return;
const to=transitions[currentState][key];history.push({kind:'event',from:currentState,event:key,to});currentState=to;render();setText('[data-operation-result]',events[key].label+' → '+states[currentState].label);
flash(find('[data-current-description-panel]'));flash(find('[data-node-state="'+currentState+'"] .stx-node-box'));flash(find('[data-sequence-rows] [data-latest="true"]'));
});
root.addEventListener('animationend',event=>{if(event.animationName==='stx-emphasis')event.target.classList.remove('stx-flash');});reduced.addEventListener('change',()=>{if(reduced.matches)all('.stx-flash').forEach(el=>el.classList.remove('stx-flash'));});render();
});
};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
})();
</script>
