   if(button.dataset.exclude){const panel=button.closest('[data-exclusion-variant]');const node=button.closest('[data-node]');node.dataset.selfExcluded=node.dataset.selfExcluded==='true'?'false':'true';
    panel.querySelectorAll('[data-node]').forEach(n=>{let parent=n.parentElement.closest('[data-node]');let inherited=false;while(parent){if(parent.dataset.selfExcluded==='true')inherited=true;parent=parent.parentElement.closest('[data-node]');}const own=n.dataset.selfExcluded==='true';const excluded=own||inherited;n.classList.toggle('excluded',excluded);n.dataset.effectiveExcluded=String(excluded);n.querySelector('[data-status]').textContent=inherited?'親の除外により対象外':own?'この処理を提案から除外':'';const toggle=n.querySelector('.node-card [data-exclude]');if(toggle){toggle.disabled=inherited;toggle.textContent=own?'この処理を戻す':'この処理を除外';toggle.setAttribute('aria-pressed',String(own));}});
    const active=[...panel.querySelectorAll('[data-node]')].filter(n=>n.dataset.effectiveExcluded!=='true');panel.querySelector('[data-count]').textContent=active.length+' 件 / '+new Set(active.map(n=>n.dataset.file)).size+' ファイル';
   }

 });};
