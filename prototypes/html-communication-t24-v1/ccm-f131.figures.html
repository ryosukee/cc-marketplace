<template data-fig="conditional">

<template data-fig="slider">
<div class="t24-demo" data-demo="slider">
  <div class="t24-compare"><p class="t24-compare-label">比較用の操作</p><div class="t24-modes" role="group" aria-label="数値の入力方法の比較"><button type="button" data-mode="number" aria-pressed="true">数値入力欄あり</button><button type="button" data-mode="range" aria-pressed="false">スライダーのみ</button></div><button class="t24-reset" type="button" data-reset>例を初期状態に戻す</button></div>

<script data-scope="t24-prototype">
(function () {
'use strict';
function boot() {
  document.querySelectorAll('.t24-demo').forEach(function (root) {
    var kind = root.dataset.demo, mode = root.querySelector('[data-mode]').dataset.mode;
    var selected = null, answered = false, initial = ['0','1','2'], drag = null;
    var list = root.querySelector('.t24-rank'), range = root.querySelector('[type="range"]'), number = root.querySelector('[type="number"]');
    function announce() {
      if (kind === 'rank') {
        var rows = Array.from(list.children);
        rows.forEach(function (li, i) {
          li.querySelector('.t24-position').textContent = String(i + 1);
          li.querySelector('[data-move="-1"]').setAttribute('aria-disabled', String(i === 0));
          li.querySelector('[data-move="1"]').setAttribute('aria-disabled', String(i === rows.length - 1));
        });
        root.querySelector('.t24-answer').textContent = answered ? '例の回答 ' + rows.map(function (li,i) { return (i+1) + '位 ' + li.querySelector('.t24-item-name').textContent; }).join('、') : '例の回答は未回答です。';
      } else if (kind === 'slider') {
        root.querySelector('output').textContent = range.value + '分';
        range.setAttribute('aria-valuetext', range.value + '分');
        root.querySelector('.t24-answer').textContent = answered ? '例の回答 ' + range.value + '分' : '例の回答は未回答です。';
      }
    }
    function condition() {
      var area = root.querySelector('.t24-explanations');
      var choices = [{value:'mail', heading:'メール通知の場合', text:'登録したメールアドレスに通知します。メールを受信できることを確認してください。'}, {value:'screen', heading:'画面内通知の場合', text:'ページを開いている間、画面内に通知します。メールは送信しません。'}];
      area.replaceChildren();
      if (!selected) { var p = document.createElement('p'); p.className = 't24-empty'; p.textContent = '選ぶと、その条件の説明が出ます。'; area.append(p); }
      choices.forEach(function (choice) {
        if (choice.value === selected) {
          var section = document.createElement('div'); section.className = 't24-active-explanation';
          var heading = document.createElement('p'); heading.className = 't24-condition-heading'; heading.textContent = choice.heading;
          var text = document.createElement('p'); text.textContent = choice.text; section.append(heading,text); area.append(section);
        } else if (mode === 'fold') {
          var details = document.createElement('details'), summary = document.createElement('summary'), body = document.createElement('p');
          summary.textContent = choice.heading + '（未選択）'; body.textContent = choice.text; details.append(summary,body); area.append(details);
        }
      });
      root.querySelectorAll('[data-notification]').forEach(function (b) { b.setAttribute('aria-pressed',String(b.dataset.notification === selected)); });
      root.querySelector('.t24-condition-status').textContent = selected ? '例の選択 ' + (selected === 'mail' ? 'メール通知' : '画面内通知') : '通知方法は未選択です。';
    }
    function applyMode() {
      root.querySelectorAll('[data-mode]').forEach(function (b) { b.setAttribute('aria-pressed',String(b.dataset.mode === mode)); });
      if (kind === 'conditional') condition();
      if (kind === 'rank') root.querySelectorAll('.t24-grip').forEach(function (b) { b.hidden = mode !== 'drag'; });
      if (kind === 'slider') { root.querySelector('.t24-number-row').hidden = mode !== 'number'; if (mode === 'range') { number.value=range.value; clearError(); } }
    }
    function move(li, delta, focus) {
      var target = delta < 0 ? li.previousElementSibling : li.nextElementSibling;
      if (!target) return;
      if (delta < 0) list.insertBefore(li,target); else list.insertBefore(target,li);
      answered = true; announce(); if (focus) focus.focus({preventScroll:true});
    }
    function clearError() { if (!number) return; number.setCustomValidity(''); var err=root.querySelector('.t24-error'); err.hidden=true; err.textContent=''; root.querySelector('[data-confirm]').disabled=false; }
    function validNumber() {
      var value = number.valueAsNumber;
      if (!Number.isFinite(value) || value < 5 || value > 60 || value % 5 !== 0) {
        var err=root.querySelector('.t24-error'); err.textContent='5〜60の範囲で、5刻みの数値を入力してください。'; err.hidden=false;
        number.setCustomValidity(err.textContent); root.querySelector('[data-confirm]').disabled=true; return false;
      }
      clearError(); return true;
    }
    root.addEventListener('click',function (event) {
      var b=event.target.closest('button'); if (!b || !root.contains(b)) return;
      if (b.hasAttribute('data-mode')) { mode=b.dataset.mode; applyMode(); }
      else if (b.hasAttribute('data-notification')) { selected=b.dataset.notification; condition(); }
      else if (b.hasAttribute('data-move')) move(b.closest('li'),Number(b.dataset.move),b);
      else if (b.hasAttribute('data-confirm')) { if (kind === 'slider' && mode === 'number' && !validNumber()) return; answered=true; announce(); }
      else if (b.hasAttribute('data-reset')) {
        answered=false; selected=null;
        if (list) initial.forEach(function(id) { list.append(list.querySelector('[data-item="'+id+'"]')); });
        if (range) { range.value='30'; number.value='30'; clearError(); }
        if (kind === 'conditional') condition(); else announce();
      }
    });
    root.addEventListener('input',function (event) {
      event.stopPropagation();
      if (event.target === range) { number.value=range.value; clearError(); answered=true; announce(); }
      else if (event.target === number && validNumber()) { range.value=number.value; answered=true; announce(); }
    });
    root.addEventListener('change',function(event){ event.stopPropagation(); });
    if (list) {
      list.addEventListener('pointerdown',function(event){
        var grip=event.target.closest('.t24-grip'); if (!grip || mode !== 'drag' || event.button !== 0) return;
        drag={li:grip.closest('li'), grip:grip, x:event.clientX, y:event.clientY}; grip.setPointerCapture(event.pointerId); grip.closest('li').classList.add('t24-dragging');
      });
      list.addEventListener('pointermove',function(event){
        if (!drag) return; var over=document.elementFromPoint(event.clientX,event.clientY); var li=over && over.closest('.t24-rank > li');
        list.querySelectorAll('.t24-drop-target').forEach(function(x){x.classList.remove('t24-drop-target');});
        if (li && list.contains(li) && li !== drag.li) li.classList.add('t24-drop-target');
      });
      function end(event,cancel) {
        if (!drag) return; var old=drag; drag=null;
        old.li.classList.remove('t24-dragging'); list.querySelectorAll('.t24-drop-target').forEach(function(x){x.classList.remove('t24-drop-target');});
        if (!cancel && Math.hypot(event.clientX-old.x,event.clientY-old.y)>8) {
          var over=document.elementFromPoint(event.clientX,event.clientY), target=over && over.closest('.t24-rank > li');
          if (target && list.contains(target) && target !== old.li) {
            var before=Array.from(list.children).indexOf(old.li)<Array.from(list.children).indexOf(target);
            list.insertBefore(old.li,before ? target.nextSibling : target); answered=true; announce();
          }
        }
      }
      list.addEventListener('pointerup',function(e){end(e,false);}); list.addEventListener('pointercancel',function(e){end(e,true);});
      announce();
    }
    if (range) announce(); applyMode();
  });
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded',boot,{once:true}); else boot();
})();

</script>
