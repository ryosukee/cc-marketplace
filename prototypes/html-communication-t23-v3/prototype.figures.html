'use strict';
const init = () => {
const states={scheduled:{label:'予約中',description:'指定した時刻を待っています。指定時刻に進めるか、取り消すことができます。'},sending:{label:'送信中',description:'通知の送信結果を待っています。成功か失敗を返すことができます。'},sent:{label:'送信済み',description:'配信先が通知を受理しました。終端のため、次のイベントはありません。',final:true},failed:{label:'失敗',description:'送信に失敗しました。再試行して送信中へ戻るか、取り消すことができます。'},cancelled:{label:'取消済み',description:'予約を取り消しました。以後は通知を送信しません。終端のため、次のイベントはありません。',final:true}};
const transitions={scheduled:{due:'sending',cancel:'cancelled'},sending:{ok:'sent',fail:'failed'},failed:{retry:'sending',cancel:'cancelled'},sent:{},cancelled:{}};
const events={due:{label:'指定時刻に進める',requirement:'予約中で実行できます'},ok:{label:'成功を返す',requirement:'送信中で実行できます'},fail:{label:'失敗を返す',requirement:'送信中で実行できます'},retry:{label:'再試行する',requirement:'失敗で実行できます'},cancel:{label:'取り消す',requirement:'予約中または失敗で実行できます'}};
const messages={due:[{from:0,to:1,text:'送信を依頼'},{from:1,to:2,text:'通知を送る'}],ok:[{from:2,to:1,text:'受理を返す'},{from:1,to:0,text:'送信済みを記録'}],fail:[{from:2,to:1,text:'失敗を返す'},{from:1,to:0,text:'失敗を記録'}],retry:[{from:0,to:1,text:'送信を再依頼'},{from:1,to:2,text:'通知を送る'}],cancel:[{from:0,to:1,text:'取消を通知'}]};
const actors=['予約管理','送信処理','配信先'];
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)');
document.querySelectorAll('.stx[data-demo="state-transition"]').forEach(root=>{
if(root.dataset.initialized)return;root.dataset.initialized='true';
let viewState='scheduled',trialState='scheduled',history=[];
const find=s=>root.querySelector(s),all=s=>Array.from(root.querySelectorAll(s));
const node=(tag,cls,text)=>{const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el;};
const setText=(s,text)=>{find(s).textContent=text;};
const flash=el=>{if(!el||reduced.matches)return;el.classList.remove('stx-flash');void el.getBoundingClientRect();el.classList.add('stx-flash');};
const renderMap=()=>{
const reached=new Set(['scheduled',...history.map(step=>step.to)]);
all('[data-node-state]').forEach(g=>{const state=g.dataset.nodeState;g.dataset.current=String(state===trialState);g.dataset.reached=String(reached.has(state));g.querySelector('[data-node-status]').textContent=state===trialState?'● 現在':reached.has(state)?'到達済み':states[state].final?'終端':'未到達';g.querySelector('[data-node-view]').toggleAttribute('hidden',state!==viewState);g.querySelector('[data-node-view-label]').toggleAttribute('hidden',state!==viewState);});
const last=history.at(-1);all('[data-edge-event]').forEach(g=>g.dataset.latest=String(Boolean(last&&g.dataset.edgeFrom===last.from&&g.dataset.edgeEvent===last.event)));
find('.stx-map').setAttribute('aria-label','予約通知の状態遷移図。現在は'+states[trialState].label+'。説明中は'+states[viewState].label+'。');
};
const renderView=()=>{root.dataset.viewState=viewState;all('[data-action="browse"]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.state===viewState)));setText('[data-view-label]',states[viewState].label);setText('[data-view-description]',states[viewState].description);renderMap();};
const renderTrial=()=>{root.dataset.trialState=trialState;setText('[data-trial-label]',states[trialState].label+(states[trialState].final?' · 終端':''));all('[data-action="event"]').forEach(b=>{const key=b.dataset.event;const enabled=Object.hasOwn(transitions[trialState],key);b.disabled=!enabled;const reason=enabled?'実行できます':states[trialState].final?'終端のため実行できません':events[key].requirement;b.title=reason;b.setAttribute('aria-label',events[key].label+'。'+reason);});setText('[data-terminal-note]',states[trialState].final?'終端に到達しました。「実行をリセット」で別の経路を試せます。':'青いボタンが実行可能。実行すると、下の図・履歴・通信が変わります。');find('[data-action="reset"]').disabled=!history.length;renderMap();};
const renderResults=()=>{
const sequence=find('[data-sequence-rows]');sequence.parentElement.dataset.empty=String(!history.length);sequence.replaceChildren();let count=0;
if(!history.length)sequence.append(node('p','stx-empty','まだ通信はありません。上の「指定時刻に進める」か「取り消す」を実行すると、ここに追加されます。'));
history.forEach((step,index)=>{const group=node('div','stx-seq-group');group.dataset.occurrence=String(index+1);group.dataset.event=step.event;group.dataset.latest=String(index===history.length-1);const heading=node('div','stx-seq-event');heading.append(node('span','',String(index+1)+' · '+events[step.event].label));if(index===history.length-1)heading.append(node('span','stx-latest-tag','直前に実行'));group.append(heading);messages[step.event].forEach((message,mi)=>{count++;const row=node('div','stx-seq-row');row.dataset.message=step.event+'-'+String(mi+1);row.style.setProperty('--stx-left',String(Math.min(message.from,message.to)*100/3+100/6)+'%');row.style.setProperty('--stx-right',String(100-(Math.max(message.from,message.to)*100/3+100/6))+'%');const label=node('span','stx-msg',message.text),wire=node('span','stx-wire');label.setAttribute('aria-hidden','true');wire.setAttribute('aria-hidden','true');wire.dataset.direction=message.to>message.from?'forward':'back';row.append(label,wire,node('span','stx-sr',actors[message.from]+'から'+actors[message.to]+'へ、'+message.text+'。'));group.append(row);});sequence.append(group);});
setText('[data-sequence-count]',history.length+' 回のイベント · '+count+' 件の通信');
const route=find('[data-route]');route.replaceChildren();
const addRoute=(step,index)=>{const row=node('li','stx-route-row');row.dataset.current=String(index===history.length);row.dataset.step=String(index);row.append(node('span','stx-route-event',step?String(index)+' · '+events[step.event].label+' →':'初期状態'));const state=node('span','stx-route-state',states[step?step.to:'scheduled'].label);if(index===history.length)state.append(node('span','stx-route-current','● 現在'));row.append(state);route.append(row);};addRoute(null,0);history.forEach((step,index)=>addRoute(step,index+1));setText('[data-route-note]',history.length?'最後の行が現在の状態です。':'初期状態だけを表示しています。');
if(history.length){route.scrollTop=route.scrollHeight;const viewport=find('.stx-sequence-viewport');viewport.scrollTop=viewport.scrollHeight;}
};
root.addEventListener('click',event=>{const button=event.target.closest('button[data-action]');if(!button||!root.contains(button)||button.disabled)return;
if(button.dataset.action==='browse'){if(!Object.hasOwn(states,button.dataset.state))return;viewState=button.dataset.state;renderView();flash(find('.stx-detail'));return;}
if(button.dataset.action==='event'){const key=button.dataset.event;if(!Object.hasOwn(transitions[trialState],key))return;const to=transitions[trialState][key];history.push({from:trialState,event:key,to});trialState=to;renderTrial();renderResults();setText('[data-result-announcement]',events[key].label+'を実行。現在は'+states[trialState].label+'。説明中は'+states[viewState].label+'のままです。');flash(find('[data-node-state="'+trialState+'"] .stx-node-box'));flash(find('.stx-seq-group[data-latest="true"]'));return;}
if(button.dataset.action==='reset'){history=[];trialState='scheduled';renderTrial();renderResults();all('.stx-flash').forEach(el=>el.classList.remove('stx-flash'));setText('[data-result-announcement]','現在・履歴・通信を初期状態へ戻しました。説明中は'+states[viewState].label+'のままです。');}
});
root.addEventListener('animationend',event=>{if(event.animationName.startsWith('stx-'))event.target.classList.remove('stx-flash');});
reduced.addEventListener('change',()=>{if(reduced.matches)all('.stx-flash').forEach(el=>el.classList.remove('stx-flash'));});
renderView();renderTrial();renderResults();
});
};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
})();
</script>
