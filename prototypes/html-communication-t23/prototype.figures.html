="true"></span></div><span class="mtr-sq-status">未実行</span></div><div class="mtr-seq-row" data-message="ok-record" data-status="unrun"><div class="mtr-communication" data-direction="back" style="--mtr-from:1;--mtr-to:3"><span class="mtr-msg">送信済みを記録<small>成功時</small></span><span class="mtr-wire" aria-hidden="true"></span></div><span class="mtr-sq-status">未実行</span></div><div class="mtr-seq-row" data-message="fail-response" data-status="unrun"><div class="mtr-communication" data-direction="back" style="--mtr-from:2;--mtr-to:4"><span class="mtr-msg">失敗を返す<small>失敗時</small></span><span class="mtr-wire" aria-hidden="true"></span></div><span class="mtr-sq-status">未実行</span></div><div class="mtr-seq-row" data-message="fail-record" data-status="unrun"><div class="mtr-communication" data-direction="back" style="--mtr-from:1;--mtr-to:3"><span class="mtr-msg">失敗を記録<small>失敗時</small></span><span class="mtr-wire" aria-hidden="true"></span></div><span class="mtr-sq-status">未実行</span></div><div class="mtr-seq-row" data-message="retry-request" data-status="unrun"><div class="mtr-communication" data-direction="forward" style="--mtr-from:1;--mtr-to:3"><span class="mtr-msg">送信を再依頼<small>再試行時</small></span><span class="mtr-wire" aria-hidden="true"></span></div><span class="mtr-sq-status">未実行</span></div><div class="mtr-seq-row" data-message="retry-delivery" data-status="unrun"><div class="mtr-communication" data-direction="forward" style="--mtr-from:2;--mtr-to:4"><span class="mtr-msg">通知を送る<small>再試行時</small></span><span class="mtr-wire" aria-hidden="true"></span></div><span class="mtr-sq-status">未実行</span></div><div class="mtr-seq-row" data-message="cancel-request" data-status="unrun"><div class="mtr-communication" data-direction="forward" style="--mtr-from:1;--mtr-to:3"><span class="mtr-msg">取消を通知<small>取消時</small></span><span class="mtr-wire" aria-hidden="true"></span></div><span class="mtr-sq-status">未実行</span></div></div></div></div><p class="mtr-note" data-sequence-note>まだイベントを実 lass="mtr-msg">受理を返す<small>成功時</small></span><span class="mtr-wire" aria-hidden="true"></span></div><span class="mtr-sq-status">未実行</span></div><div class="mtr-seq-row" data-message="ok-record" data-status="unrun"><div class="mtr-communication" data-direction="back" style="--mtr-from:1;--mtr-to:3"><span class="mtr-msg">送信済みを記録<small>成功時</small></span><span class="mtr-wire" aria-hidden="true"></span></div><span class="mtr-sq-status">未実行</span></div><div class="mtr-seq-row" data-message="fail-response" data-status="unrun"><div class="mtr-communication" data-direction="back" style="--mtr-from:2;--mtr-to:4"><span class="mtr-msg">失敗を返す<small>失敗時</small></span><span class="mtr-wire" aria-hidden="true"></span></div><span class="mtr-sq-status">未実行</span></div><div class="mtr-seq-row" data-message="fail-record" data-status="unrun"><div class="mtr-communication" data-direction="back" style="--mtr-from:1;--mtr-to:3"><span class="mtr-msg">失敗を記録<small>失敗時</small></span><span class="mtr-wire" aria-hidden="true"></span></div><span class="mtr-sq-status">未実行</span></div><div class="mtr-seq-row" data-message="retry-request" data-status="unrun"><div class="mtr-communication" data-direction="forward" style="--mtr-from:1;--mtr-to:3"><span class="mtr-msg">送信を再依頼<small>再試行時</small></span><span class="mtr-wire" aria-hidden="true"></span></div><span class="mtr-sq-status">未実行</span></div><div class="mtr-seq-row" data-message="retry-delivery" data-status="unrun"><div class="mtr-communication" data-direction="forward" style="--mtr-from:2;--mtr-to:4"><span class="mtr-msg">通知を送る<small>再試行時</small></span><span class="mtr-wire" aria-hidden="true"></span></div><span class="mtr-sq-status">未実行</span></div><div class="mtr-seq-row" data-message="cancel-request" data-status="unrun"><div class="mtr-communication" data-direction="forward" style="--mtr-from:1;--mtr-to:3"><span class="mtr-msg">取消を通知<small>取消時</small></span><span class="mtr-wire" aria-hidden="true"></span></div><span class="mtr-sq-status">未実行</span></div></div></div></div><p class="mtr-note" data-sequence-note>まだイベントを実行していない。通信はすべて未実行。</p><div class="mtr-history"><h4 class="mtr-section-title">この例で試した経路</h4><pre class="mtr-code" data-history>予約中（初期状態）</pre><p class="mtr-note">この経路は例の中だけに残る。ページを再読込すると消える。</p></div><div class="mtr-answer"><h4 class="mtr-section-title">回答に含める例文</h4><span class="mtr-tag">読み取り専用・本物の回答と別</span><div class="mtr-gap" data-attach-controls hidden style="margin-top:12px"><button type="button" data-action="attach">経路を例文へ添付</button><button type="button" class="mtr-secondary" data-action="detach">例文の添付を解除</button></div><p class="mtr-attach-status" data-attach-status>経路は例の中だけに残す。</p><pre class="mtr-code" data-answer-preview>回答の選択内容（例）

<script>
document.addEventListener('DOMContentLoaded', () => {
  'use strict';
  const states = {
    scheduled: { label: '予約中', description: '指定した時刻を待つ' },
    sending: { label: '送信中', description: '通知の結果を待つ' },
    sent: { label: '送信済み', description: '配信先が受理した', final: true },
    failed: { label: '失敗', description: '再試行か取消を選ぶ' },
    cancelled: { label: '取消済み', description: '通知を送らず終了した', final: true }
  };
  const transitions = {
    scheduled: { due: 'sending', cancel: 'cancelled' },
    sending: { ok: 'sent', fail: 'failed' },
    failed: { retry: 'sending', cancel: 'cancelled' },
    sent: {}, cancelled: {}
  };
  const eventNames = { due: '時刻到来', ok: '成功', fail: '失敗', retry: '再試行', cancel: '取消' };
  const messages = [
    { id: 'due-request', event: 'due', from: 1, to: 3, direction: 'forward', label: '送信を依頼', branch: '時刻到来' },
    { id: 'due-delivery', event: 'due', from: 2, to: 4, direction: 'forward', label: '通知を送る', branch: '時刻到来' },
    { id: 'ok-response', event: 'ok', from: 2, to: 4, direction: 'back', label: '受理を返す', branch: '成功時' },
    { id: 'ok-record', event: 'ok', from: 1, to: 3, direction: 'back', label: '送信済みを記録', branch: '成功時' },
    { id: 'fail-response', event: 'fail', from: 2, to: 4, direction: 'back', label: '失敗を返す', branch: '失敗時' },
    { id: 'fail-record', event: 'fail', from: 1, to: 3, direction: 'back', label: '失敗を記録', branch: '失敗時' },
    { id: 'retry-request', event: 'retry', from: 1, to: 3, direction: 'forward', label: '送信を再依頼', branch: '再試行時' },
    { id: 'retry-delivery', event: 'retry', from: 2, to: 4, direction: 'forward', label: '通知を送る', branch: '再試行時' },
    { id: 'cancel-request', event: 'cancel', from: 1, to: 3, direction: 'forward', label: '取消を通知', branch: '取消時' }
  ];
  const stateCommunication = { scheduled: [], sending: ['due', 'retry'], sent: ['ok'], failed: ['fail'], cancelled: ['cancel'] };
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  document.querySelectorAll('.mtr[data-demo]').forEach((root) => {
    const kind = root.dataset.demo;
    let browseState = 'scheduled';
    let trialState = 'scheduled';
    let source = ['tabs', 'together'].includes(kind) ? 'browse' : 'trial';
    let range = 'all';
    let motion = 'pulse';
    let answerMode = 'local';
    let history = [];
    let attached = null;
    const visited = new Set(['scheduled']);
    const find = (selector) => root.querySelector(selector);
    const all = (selector) => Array.from(root.querySelectorAll(selector));
    const routeText = () => history.length ? '予約中\n' + history.map((step, index) => (index + 1) + '. ' + eventNames[step.event] + ' → ' + states[step.to].label).join('\n') : '予約中（初期状態）';
    const setText = (selector, text) => { const el = find(selector); if (el) el.textContent = text; };
    const activeEvents = () => source === 'browse' ? stateCommunication[browseState] : history.length ? [history[history.length - 1].event] : [];
    const makeMessage = (message, status, occurrence) => {
      const row = document.createElement('div');
      row.className = 'mtr-seq-row';
      row.dataset.message = message.id;
      row.dataset.status = status;
      const communication = document.createElement('div');
      communication.className = 'mtr-communication';
      communication.dataset.direction = message.direction;
      communication.style.setProperty('--mtr-from', message.from);
      communication.style.setProperty('--mtr-to', message.to);
      const label = document.createElement('span');
      label.className = 'mtr-msg';
      label.textContent = message.label;
      const detail = document.createElement('small');
      detail.textContent = occurrence == null ? message.branch : 'イベント ' + occurrence + '・' + message.branch;
      label.append(detail);
      const wire = document.createElement('span');
      wire.className = 'mtr-wire';
      wire.setAttribute('aria-hidden', 'true');
      const tag = document.createElement('span');
      tag.className = 'mtr-sq-status';
      tag.textContent = status === 'current' ? (source === 'browse' ? '選択中に対応' : '現在') : status === 'past' ? '経過' : (source === 'browse' ? '対象外' : '未実行');
      communication.append(label, wire);
      row.append(communication, tag);
      return row;
    };
    const renderSequence = () => {
      const container = find('[data-sequence-rows]');
      container.replaceChildren();
      const active = activeEvents();
      if (range === 'history' && source === 'trial') {
        history.forEach((step, index) => {
          messages.filter((message) => message.event === step.event).forEach((message) => container.append(makeMessage(message, index === history.length - 1 ? 'current' : 'past', index + 1)));
        });
      } else {
        const previous = new Set(source === 'trial' ? history.slice(0, -1).map((step) => step.event) : []);
        messages.forEach((message) => {
          if (range === 'current' && !active.includes(message.event)) return;
          container.append(makeMessage(message, active.includes(message.event) ? 'current' : previous.has(message.event) ? 'past' : 'unrun'));
        });
      }
      if (!container.childElementCount) {
        const empty = document.createElement('div');
        empty.className = 'mtr-seq-empty';
        empty.textContent = 'まだ通信はない。時刻到来か取消を実行すると表示する。';
        container.append(empty);
      }
      setText('[data-sequence-note]', source === 'browse' ? '選んだ状態に対応する通信を示す。イベントを実行した経過は示していない。' : history.length ? (range === 'all' ? '現在は直前のイベントに対応する通信。経過は実際に実行した通信だけ。未実行はまだ試していない分岐。' : range === 'history' ? 'イベントを実行した順に並ぶ。同じ再試行を繰り返すと、その通信も繰り返して並ぶ。' : '直前のイベントに対応する通信だけを表示する。') : 'まだイベントを実行していない。通信はすべて未実行。');
    };
    const renderAnswer = () => {
      if (kind !== 'answer') return;
      find('[data-attach-controls]').hidden = answerMode !== 'attach';
      const exists = history.length > 0;
      find('[data-action="attach"]').disabled = !exists;
      find('[data-action="detach"]').disabled = attached === null;
      let preview = '回答の選択内容（例）';
      let note;
      if (answerMode === 'local') {
        preview += '\n試行履歴は含めない。';
        note = '経路は例の中だけに残す。';
      } else if (answerMode === 'auto') {
        preview += exists ? '\n\n自動で含める試行履歴\n' + routeText() : '\nまだ試行履歴はない。';
        note = '最新の試行経路を、例文へ自動で含める。';
      } else {
        preview += attached === null ? '\n経路をまだ添付していない。' : '\n\n明示して添付した試行履歴\n' + attached;
        note = attached === null ? '「経路を例文へ添付」で、その時点の経路を含める。' : '添付した時点の経路を保持する。後の試行は、再度添付するまで反映しない。';
      }
      setText('[data-attach-status]', note);
      setText('[data-answer-preview]', preview);
    };
    const render = (emphasize = false) => {
      const current = source === 'browse' ? browseState : trialState;
      root.dataset.source = source;
      root.dataset.current = current;
      root.dataset.trialState = trialState;
      setText('[data-current-source]', source === 'browse' ? '状態の閲覧中・経路には加えない' : 'イベントの試行中');
      setText('[data-current-label]', states[current].label);
      setText('[data-current-desc]', states[current].description + (states[current].final ? '・終端' : ''));
      all('.mtr-state').forEach((card) => {
        const key = card.dataset.state;
        const status = key === current ? 'current' : source === 'trial' && visited.has(key) ? 'past' : 'unrun';
        card.dataset.status = status;
        card.querySelector('.mtr-status').textContent = status === 'current' ? (source === 'browse' ? '選択中' : '現在') : status === 'past' ? '経過' : (source === 'browse' ? '未選択' : '未実行');
      });
      all('[data-action="browse"]').forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.value === browseState)));
      all('[data-action="event"]').forEach((button) => { button.disabled = !Object.hasOwn(transitions[trialState], button.dataset.value); });
      setText('[data-browse-label]', '閲覧対象は' + states[browseState].label + '。');
      const legal = Object.keys(transitions[trialState]).map((event) => eventNames[event]);
      setText('[data-trial-label]', '試行の現在は' + states[trialState].label + '。' + (legal.length ? legal.join('か') + 'を実行できる。' : '終端なので、次のイベントは実行できない。'));
      if (kind === 'tabs') {
        all('[data-panel]').forEach((panel) => { panel.hidden = panel.dataset.panel !== source; });
        all('[data-action="tab"]').forEach((button) => { const active = button.dataset.value === source; button.setAttribute('aria-selected', String(active)); button.tabIndex = active ? 0 : -1; });
      }
      all('[data-action="range"]').forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.value === range)));
      all('[data-action="motion"]').forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.value === motion)));
      all('[data-action="answer-mode"]').forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.value === answerMode)));
      setText('[data-history]', routeText());
      renderSequence();
      renderAnswer();
      if (kind === 'motion') setText('[data-motion-note]', reducedMotion.matches ? '端末が動きを減らす設定のため、短い強調も抑止する。' : motion === 'pulse' ? '手操作直後だけ輪郭を短く強調する。強調の後も文字と現在のラベルは残る。' : '一時的な強調を加えず、状態と通信をすぐ更新する。');
      if (emphasize && motion === 'pulse' && !reducedMotion.matches) {
        const targets = [find('.mtr-current'), ...all('.mtr-seq-row[data-status="current"]')];
        targets.forEach((target) => {
          target.classList.remove('mtr-flash');
          void target.offsetWidth;
          target.classList.add('mtr-flash');
        });
      }
    };
    root.addEventListener('click', (event) => {
      const button = event.target.closest('button[data-action]');
      if (!button || !root.contains(button) || button.disabled) return;
      const value = button.dataset.value;
      switch (button.dataset.action) {
        case 'browse':
          browseState = value;
          source = 'browse';
          render(kind === 'motion');
          break;
        case 'tab':
          source = value;
          render();
          break;
        case 'event': {
          const destination = transitions[trialState][value];
          if (!destination) return;
          history.push({ event: value, from: trialState, to: destination });
          trialState = destination;
          source = 'trial';
          visited.add(destination);
          render(kind === 'motion');
          break;
        }
        case 'range': range = value; render(); break;
        case 'motion': motion = value; render(); break;
        case 'answer-mode': answerMode = value; attached = null; render(); break;
        case 'attach': attached = routeText(); render(); break;
        case 'detach': attached = null; render(); break;
        case 'reset':
          browseState = 'scheduled'; trialState = 'scheduled';
          source = ['tabs', 'together'].includes(kind) ? 'browse' : 'trial';
          history = []; attached = null; visited.clear(); visited.add('scheduled');
          render();
          break;
      }
    });
    root.addEventListener('keydown', (event) => {
      const tab = event.target.closest('[role="tab"]');
      if (!tab || !root.contains(tab) || !['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
      const tabs = all('[role="tab"]');
      const index = tabs.indexOf(tab);
      const next = event.key === 'Home' ? 0 : event.key === 'End' ? tabs.length - 1 : (index + (event.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length;
      event.preventDefault();
      tabs[next].focus();
      tabs[next].click();
    });
    reducedMotion.addEventListener('change', () => {
      all('.mtr-flash').forEach((target) => target.classList.remove('mtr-flash'));
      render();
    });
    root.addEventListener('animationend', (event) => { if (event.animationName === 'mtr-emphasis') event.target.classList.remove('mtr-flash'); });
    render();
  });
});
</script>
