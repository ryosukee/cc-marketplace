};
const activate=c=>{
if(c.matches('[data-layout-option]')){root.dataset.layout=c.dataset.layoutOption;all('[data-layout-option]').forEach(b=>b.setAttribute('aria-pressed',String(b===c)));return;}
if(c.matches('[data-node-state]')){initial=c.dataset.nodeState;current=initial;history=[];render();return;}
if(c.getAttribute('aria-disabled')==='true'||c.dataset.from!==current||states[current].final)return;
const action=c.dataset.action;if(!['send','cancel'].includes(action))return;
const response=action==='send'?c.dataset.result:'local';if(action==='send'&&!['accepted','rejected'].includes(response))return;
const from=current,to=action==='cancel'?'cancelled':response==='accepted'?'notified':'failed',result=action==='cancel'?'取消完了':response==='accepted'?'成功（受理）':'失敗（拒否）';
history.push({from,to,action,response,result});current=to;render();
if(!reduced.matches){const n=$('[data-node-state="'+current+'"]');n.classList.remove('rsv-flash');void n.getBoundingClientRect();n.classList.add('rsv-flash');}
};
const selector='[data-node-state],[data-action],[data-layout-option]';
root.addEventListener('click',event=>{event.stopPropagation();const c=event.target.closest(selector);if(!c||!root.contains(c))return;event.preventDefault();activate(c);});
root.addEventListener('keydown',event=>{event.stopPropagation();if(!['Enter',' '].includes(event.key)||event.repeat)return;const c=event.target.closest(selector);if(!c||!root.contains(c))return;event.preventDefault();activate(c);});
root.addEventListener('animationend',event=>{if(event.animationName==='rsv13-emphasis')event.target.closest('.rsv-node')?.classList.remove('rsv-flash');});
reduced.addEventListener('change',()=>{if(reduced.matches)all('.rsv-flash').forEach(n=>n.classList.remove('rsv-flash'));});
for(const kind of ['input','change','keyup'])root.addEventListener(kind,event=>event.stopPropagation());
render();
});
};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
})();

</script>
