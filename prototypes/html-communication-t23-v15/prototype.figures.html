<style data-scope="figures">

.np .grid{display:grid}.np .items-start{align-items:flex-start}
.np{--np-bg:#fff;--np-soft:#f5f7fb;--np-line:#93a3b9;--np-ink:#243244;--np-muted:#53647b;--np-accent:#185fc1;--np-selected:#eaf2ff;--np-shadow:rgba(28,47,74,.18);color:var(--np-ink)}
@media(prefers-color-scheme:dark){.np{--np-bg:#192536;--np-soft:#223248;--np-line:#768ca8;--np-ink:#edf3fc;--np-muted:#becde0;--np-accent:#9bc5ff;--np-selected:#2b4262;--np-shadow:rgba(0,0,0,.5)}}
.np .np-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.np .np-case{border:1px solid var(--np-line);border-radius:12px;background:var(--np-bg);padding:20px;min-width:0}
.np .np-heading{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.np .np-heading h3{font-size:1em;margin:0}.np .np-initial{font-size:13px;color:var(--np-muted);margin:0}
.np .np-pair{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;padding:8px 0 16px}
.np button.np-node{box-sizing:border-box;width:190px;height:108px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;border:1.5px solid var(--np-line);border-radius:10px;background:var(--np-soft);color:var(--np-ink);font:inherit;cursor:pointer;padding:12px;transition:transform .12s,box-shadow .12s,background .12s,border-color .12s}
.np .np-name{font-size:17px;font-weight:700;line-height:1.4}.np .np-desc{font-size:13px;line-height:1.5;color:var(--np-muted);white-space:nowrap}
.np button.np-node[data-current=true]{border:3px solid var(--np-accent);background:var(--np-selected)}
.np button.np-node:hover{background:var(--np-selected);border-color:var(--np-accent)}
.np button.np-node:focus-visible{outline:3px solid var(--np-accent);outline-offset:4px}
.np button.np-node:active{transform:translateY(2px)}
.np .np-case[data-design=a] .np-node{box-shadow:0 4px 0 var(--np-line),0 6px 12px var(--np-shadow)}
.np .np-case[data-design=a] .np-node:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--np-line),0 8px 16px var(--np-shadow)}
.np .np-case[data-design=a] .np-node:active{transform:translateY(3px);box-shadow:0 1px 0 var(--np-line)}
.np .np-case[data-design=b] .np-node{padding-left:34px;gap:8px}
.np .np-choice{position:absolute;left:11px;top:18px;width:16px;height:16px;box-sizing:border-box;border:1.5px solid var(--np-line);border-radius:50%;background:var(--np-bg)}
.np [data-current=true] .np-choice{border-color:var(--np-accent);box-shadow:inset 0 0 0 3px var(--np-bg);background:var(--np-accent)}
.np .np-case[data-design=b] .np-node:hover .np-choice{border-color:var(--np-accent)}
.np .np-case[data-design=c] .np-node{padding:12px 8px 36px;gap:5px;overflow:hidden}
.np .np-action{position:absolute;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:10px;height:29px;border-top:1px solid var(--np-line);color:var(--np-accent);font-size:12px;font-weight:650;background:var(--np-bg)}
.np .np-case[data-design=c] .np-node:hover .np-action{background:var(--np-selected)}
.np .np-case[data-design=d] .np-node{padding-right:38px;gap:8px}
.np .np-pointer{position:absolute;right:8px;top:34px;width:26px;height:30px;border:1px solid var(--np-line);border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--np-accent);background:var(--np-bg)}
.np .np-pointer svg{width:15px;height:19px;fill:currentColor}
.np .np-explanation{font-size:14px;line-height:1.7;margin:0}
.np .np-legend{font-size:14px;line-height:1.7;margin:20px 0 0;color:var(--np-muted)}
@media(max-width:1100px){.np .np-grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.np button.np-node{transition:none}.np .np-case[data-design=a] .np-node:hover,.np button.np-node:active{transform:none}}
</style>
<template data-fig="node-designs"><div class="np"><div class="np-grid grid items-start"><section class="np-case" data-design="a"><div class="np-heading"><h3>案A — 立体的なボタン</h3><p class="np-initial" role="status" aria-live="polite">初期状態：<span data-initial>予約済み</span></p></div><div class="np-pair"><button type="button" class="np-node" data-state="reserved" data-current="true" aria-label="初期状態に予約済みを選ぶ"><span class="np-name">予約済み</span><span class="np-desc">通知送信前の予約</span></button><button type="button" class="np-node" data-state="failed" data-current="false" aria-label="初期状態に通知失敗を選ぶ"><span class="np-name">通知失敗</span><span class="np-desc">送信要求が拒否された</span></button></div><p class="np-explanation">影と厚みで、ノード全体が押せるボタンだと示す。ホバーで少し浮き、押すと沈む。</p></section><section class="np-case" data-design="b"><div class="np-heading"><h3>案B — 選択丸を付ける</h3><p class="np-initial" role="status" aria-live="polite">初期状態：<span data-initial>予約済み</span></p></div><div class="np-pair"><button type="button" class="np-node" data-state="reserved" data-current="true" aria-label="初期状態に予約済みを選ぶ"><span class="np-name">予約済み</span><span class="np-desc">通知送信前の予約</span><span class="np-choice" aria-hidden="true"></span></button><button type="button" class="np-node" data-state="failed" data-current="false" aria-label="初期状態に通知失敗を選ぶ"><span class="np-name">通知失敗</span><span class="np-desc">送信要求が拒否された</span><span class="np-choice" aria-hidden="true"></span></button></div><p class="np-explanation">ノード左上の丸で選択操作を示す。現在状態は丸と青い枠で示す。</p></section><section class="np-case" data-design="c"><div class="np-heading"><h3>案C — 操作名を下段に出す</h3><p class="np-initial" role="status" aria-live="polite">初期状態：<span data-initial>予約済み</span></p></div><div class="np-pair"><button type="button" class="np-node" data-state="reserved" data-current="true" aria-label="初期状態に予約済みを選ぶ"><span class="np-name">予約済み</span><span class="np-desc">通知送信前の予約</span><span class="np-action" aria-hidden="true">この状態から試す<span>↗</span></span></button><button type="button" class="np-node" data-state="failed" data-current="false" aria-label="初期状態に通知失敗を選ぶ"><span class="np-name">通知失敗</span><span class="np-desc">送信要求が拒否された</span><span class="np-action" aria-hidden="true">この状態から試す<span>↗</span></span></button></div><p class="np-explanation">下段に「この状態から試す」と明示する。ノード全体を押せるが、操作名の分だけ情報が増える。</p></section><section class="np-case" data-design="d"><div class="np-heading"><h3>案D — 右端に操作アイコン</h3><p class="np-initial" role="status" aria-live="polite">初期状態：<span data-initial>予約済み</span></p></div><div class="np-pair"><button type="button" class="np-node" data-state="reserved" data-current="true" aria-label="初期状態に予約済みを選ぶ"><span class="np-name">予約済み</span><span class="np-desc">通知送信前の予約</span><span class="np-pointer" aria-hidden="true"><svg viewBox="0 0 24 28" xmlns="http://www.w3.org/2000/svg"><path d="M3 2V23L9 17L14 26L18 24L13 15H22Z"></path></svg></span></button><button type="button" class="np-node" data-state="failed" data-current="false" aria-label="初期状態に通知失敗を選ぶ"><span class="np-name">通知失敗</span><span class="np-desc">送信要求が拒否された</span><span class="np-pointer" aria-hidden="true"><svg viewBox="0 0 24 28" xmlns="http://www.w3.org/2000/svg"><path d="M3 2V23L9 17L14 26L18 24L13 15H22Z"></path></svg></span></button></div><p class="np-explanation">右端にポインターの記号を付け、操作できる箇所だと示す。操作の名前はノードに加えない。</p></section></div><p class="np-legend">青い枠は現在の状態。各案のノードを押すと、その例の初期状態と現在状態を一緒に選び直す。</p></div></template>
<script data-scope="figures">
(()=>{const init=()=>document.querySelectorAll('.np-case').forEach(root=>{root.addEventListener('click',e=>{const n=e.target.closest('button[data-state]');if(!n||!root.contains(n))return;e.preventDefault();e.stopPropagation();root.querySelectorAll('[data-state]').forEach(b=>b.dataset.current=String(b===n));root.querySelector('[data-initial]').textContent=n.querySelector('.np-name').textContent;});for(const kind of ['input','change','keydown','keyup'])root.addEventListener(kind,e=>e.stopPropagation());});if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();})();
</script>
