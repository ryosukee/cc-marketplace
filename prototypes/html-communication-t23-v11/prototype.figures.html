<script data-scope="figures">

(() => {
'use strict';
const init=()=>{
const states={reserved:{label:'予約済み',description:'通知の予約が登録され、まだ通知を送信していない状態です。'},failed:{label:'通知失敗',description:'通知サービスによる拒否が確定した状態です。通知送信を再実行するか、予約を取り消せます。'},notified:{label:'通知済み',description:'通知サービスが受理した状態です。配達・閲覧の完了は扱いません。次のアクションはありません。',final:true},cancelled:{label:'取消済み',description:'予約を取り消した状態です。この予約の通知は送信しません。次のアクションはありません。',final:true}};
const labels={send:'通知送信',cancel:'予約取り消し'};
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)');
document.querySelectorAll('.rsx[data-demo="reservation"]').forEach(root=>{
if(root.dataset.initialized)return;root.dataset.initialized='true';
let initial='reserved',current=initial,history=[];
const $=s=>root.querySelector(s),all=s=>Array.from(root.querySelectorAll(s));
const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;};
const text=(s,value)=>$(s).textContent=value;
const render=()=>{
root.dataset.initialState=initial;root.dataset.currentState=current;
text('[data-current-label]',states[current].label+(states[current].final?'（終端）':''));text('[data-current-description]',states[current].description);
all('[data-node-state]').forEach(n=>{const state=n.dataset.nodeState;n.dataset.current=String(state===current);n.dataset.initial=String(state===initial);n.querySelector('[data-node-initial]').textContent=state===initial?'初期状態':'ここから試す';n.querySelector('[data-node-current]').textContent=state===current?'● 現在'+(states[state].final?'・終端':''):states[state].final?'終端':'';});
all('[data-action]').forEach(a=>{const enabled=!states[current].final&&a.dataset.from===current;a.setAttribute('aria-disabled',String(!enabled));a.setAttribute('tabindex',enabled?'0':'-1');a.setAttribute('aria-label',states[a.dataset.from].label+'から'+labels[a.dataset.action]+'。'+(enabled?'実行できます':'現在の状態では実行できません'));});
const last=history.at(-1);
all('[data-path-from]').forEach(p=>{const enabled=['stem','local'].includes(p.dataset.pathResult)&&p.dataset.pathFrom===current&&!states[current].final,latest=Boolean(last&&last.from===p.dataset.pathFrom&&last.action===p.dataset.pathAction&&(['stem','local'].includes(p.dataset.pathResult)||last.response===p.dataset.pathResult));p.dataset.latest=String(latest);p.querySelector('.rsx-wire').dataset.latest=String(latest);p.querySelector('.rsx-wire').dataset.enabled=String(enabled);});
text('[data-latest-path]',last?'破線＝直前の経路：'+labels[last.action]+' · '+last.result+' · '+states[last.from].label+' → '+states[last.to].label:'破線＝直前の経路（まだ実行していません）');
const rows=$('[data-sequence-rows]');rows.replaceChildren();
const first=el('li','rsx-record');first.dataset.kind='initial';const initialLine=el('div','rsx-caption');initialLine.append(el('span','','初期状態 · '+states[initial].label+' · 通信なし'));first.append(initialLine);if(!history.length){const p=el('p','rsx-empty');p.append(el('span','','まだアクションを実行していません。'));first.append(p);}rows.append(first);
history.forEach((step,index)=>{const row=el('li','rsx-record');Object.assign(row.dataset,{kind:'action',recordAction:step.action,from:step.from,to:step.to,recordResponse:step.response,step:String(index+1)});const caption=el('div','rsx-caption');caption.append(el('span','',(index+1)+' · '+labels[step.action]+' · '+step.result),el('span','',states[step.from].label+' → '+states[step.to].label));row.append(caption);if(step.action==='cancel'){const p=el('p','rsx-empty');p.append(el('span','','対外通信なし · 予約管理内で取消を記録'));row.append(p);}else{['通知送信要求',step.response==='accepted'?'受理応答':'拒否応答'].forEach((label,mi)=>{const msg=el('div','rsx-message');msg.dataset.message=String(mi+1);msg.dataset.fromActor=mi===0?'予約管理':'通知サービス';msg.dataset.toActor=mi===0?'通知サービス':'予約管理';msg.setAttribute('aria-label',msg.dataset.fromActor+'から'+msg.dataset.toActor+'へ：'+label);const line=el('span','rsx-message-wire');line.dataset.direction=mi===0?'forward':'back';line.setAttribute('aria-hidden','true');msg.append(el('span','rsx-message-text',label),line);row.append(msg);});}rows.append(row);});
text('[data-sequence-count]',history.length+' アクション · '+history.filter(s=>s.action==='send').length*2+' 通信');
};
const activate=control=>{if(control.matches('[data-node-state]')){initial=control.dataset.nodeState;current=initial;history=[];render();return;}
if(control.getAttribute('aria-disabled')==='true'||control.dataset.from!==current||states[current].final)return;
const from=current,action=control.dataset.action;if(!['send','cancel'].includes(action))return;
const response=action==='send'?$('[data-response]').value:'local',to=action==='cancel'?'cancelled':response==='accepted'?'notified':'failed',result=action==='cancel'?'取消完了':response==='accepted'?'成功（受理）':'失敗（拒否）';
history.push({from,to,action,response,result});current=to;render();
if(!reduced.matches){const panel=$('[data-current-description-panel]');panel.classList.remove('rsx-flash');void panel.getBoundingClientRect();panel.classList.add('rsx-flash');}
};
for(const kind of ['input','change','click','keydown','keyup'])$('[data-response]').addEventListener(kind,event=>event.stopPropagation());
root.addEventListener('click',event=>{const c=event.target.closest('[data-node-state],[data-action]');if(!c||!root.contains(c))return;event.stopPropagation();event.preventDefault();activate(c);});
root.addEventListener('keydown',event=>{if(!['Enter',' '].includes(event.key))return;const c=event.target.closest('[data-node-state],[data-action]');if(!c||!root.contains(c))return;event.preventDefault();event.stopPropagation();activate(c);});
root.addEventListener('animationend',event=>{if(event.animationName==='rsx11-emphasis')event.target.classList.remove('rsx-flash');});
reduced.addEventListener('change',()=>{if(reduced.matches)all('.rsx-flash').forEach(e=>e.classList.remove('rsx-flash'));});
render();
});
};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
})();

</script>
