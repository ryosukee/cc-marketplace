<header class="stx-top"><p class="stx-eyebrow">架空の予約通知 · 操作できる状態遷移図</p><h3 class="stx-title">状態遷移・オートマトンをインタラクティブに確認する</h3><p class="stx-lead">まず「指定時刻に進める」→「失敗を返す」→「再試行する」を押してみてください。状態名を選び、好きな状態からも試せます。</p></header>
<section id="stx5-controls" class="stx-controls" aria-label="現在の状態とイベント操作"><div class="stx-current-row"><h4 class="stx-heading">現在の状態</h4><div class="stx-state-choices" role="group" aria-label="現在の状態を直接切り替える"><button type="button" class="stx-state-choice" data-action="state" data-state="scheduled" aria-pressed="true">予約中</button><button type="button" class="stx-state-choice" data-action="state" data-state="sending" aria-pressed="false">送信中</button><button type="button" class="stx-state-choice" data-action="state" data-state="sent" aria-pressed="false">送信済み</button><button type="button" class="stx-state-choice" data-action="state" data-state="failed" aria-pressed="false">失敗</button><button type="button" class="stx-state-choice" data-action="state" data-state="cancelled" aria-pressed="false">取消済み</button></div></div><p class="stx-current-description" data-current-description-panel><strong data-current-label>予約中</strong><span aria-hidden="true"> · </span><span data-current-description>指定した時刻を待っています。</span></p><div class="stx-events-block"><h4 class="stx-heading">イベントを実行</h4><div class="stx-event-row"><button type="button" class="stx-event" data-action="event" data-event="due">指定時刻に進める</button><button type="button" class="stx-event" data-action="event" data-event="ok" disabled>成功を返す</button><button type="button" class="stx-event" data-action="event" data-event="fail" disabled>失敗を返す</button><button type="button" class="stx-event" data-action="event" data-event="retry" disabled>再試行する</button><button type="button" class="stx-event" data-action="event" data-event="cancel">取り消す</button></div><p class="stx-operation-note" data-terminal-note>青いボタンで矢印に沿って進みます。状態名を選ぶと、通信せず直接切り替わります。</p><div class="stx-control-links"><a class="stx-nav" href="#stx5-current-record">最新の記録へ ↓</a><button type="button" class="stx-reset" data-action="reset" disabled>初期状態に戻す</button></div></div></section>
<div class="stx-map-head"><h4 class="stx-heading">予約通知の状態遷移</h4><div class="stx-key" role="group" aria-label="図の凡例"><span><i aria-hidden="true"></i>現在</span><span>履歴あり：選択・到達した状態</span></div></div><div class="stx-map-viewport" tabindex="0" aria-label="状態遷移図。狭い画面では左右にスクロールできます"><svg class="stx-map" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 345" width="680" height="345" role="img" aria-label="予約通知の状態遷移図" aria-describedby="stx5-diagram-desc"><desc id="stx5-diagram-desc">初期状態は予約中。指定時刻に進めると送信中。送信中で成功を返すと送信済み、失敗を返すと失敗。失敗から再試行すると送信中へ戻る。予約中または失敗から取り消すと取消済み。送信済みと取消済みは終端。</desc><defs><marker id="stx5-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--stx-line)"/></marker><marker id="stx5-arrow-current" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--stx-blue)"/></marker></defs><text class="stx-initial" x="100" y="42" text-anchor="middle">初期状態</text><g class="stx-edge" data-edge-from="scheduled" data-edge-event="due" data-from="scheduled" data-to="sending" data-event="due"><path d="M160 100H280"/><text x="220" y="84" text-anchor="middle">指定時刻に進める</text></g><g class="stx-edge" data-edge-from="sending" data-edge-event="ok" data-from="sending" data-to="sent" data-event="ok"><path d="M400 100H520"/><text x="460" y="84" text-anchor="middle">成功を返す</text></g><g class="stx-edge" data-edge-from="sending" data-edge-event="fail" data-from="sending" data-to="failed" data-event="fail"><path d="M310 140V245"/><text x="258" y="199" text-anchor="middle">失敗を返す</text></g><g class="stx-edge" data-edge-from="failed" data-edge-event="retry" data-from="failed" data-to="sending" data-event="retry"><path d="M400 285H480V180H370V140"/><text x="540" y="225" text-anchor="middle">再試行する</text></g><g class="stx-edge" data-edge-from="scheduled" data-edge-event="cancel" data-from="scheduled" data-to="cancelled" data-event="cancel"><path d="M100 140V245"/><text x="155" y="199" text-anchor="middle">取り消す</text></g><g class="stx-edge" data-edge-from="failed" data-edge-event="cancel" data-from="failed" data-to="cancelled" data-event="cancel"><path d="M280 285H160"/><text x="220" y="269" text-anchor="middle">取り消す</text></g><g class="stx-node" data-node-state="scheduled"><rect class="stx-node-box" x="40" y="60" width="120" height="80" rx="10"/><text class="stx-node-name" x="100" y="87" text-anchor="middle">予約中</text><text class="stx-node-status" data-node-status x="100" y="108" text-anchor="middle"></text></g><g class="stx-node" data-node-state="sending"><rect class="stx-node-box" x="280" y="60" width="120" height="80" rx="10"/><text class="stx-node-name" x="340" y="87" text-anchor="middle">送信中</text><text class="stx-node-status" data-node-status x="340" y="108" text-anchor="middle"></text></g><g class="stx-node" data-node-state="sent"><rect class="stx-node-box" x="520" y="60" width="120" height="80" rx="10"/><text class="stx-node-name" x="580" y="87" text-anchor="middle">送信済み</text><text class="stx-node-status" data-node-status x="580" y="108" text-anchor="middle"></text></g><g class="stx-node" data-node-state="failed"><rect class="stx-node-box" x="280" y="245" width="120" height="80" rx="10"/><text class="stx-node-name" x="340" y="272" text-anchor="middle">失敗</text><text class="stx-node-status" data-node-status x="340" y="293" text-anchor="middle"></text></g><g class="stx-node" data-node-state="cancelled"><rect class="stx-node-box" x="40" y="245" width="120" height="80" rx="10"/><text class="stx-node-name" x="100" y="272" text-anchor="middle">取消済み</text><text class="stx-node-status" data-node-status x="100" y="293" text-anchor="middle"></text></g></svg></div><p class="stx-map-instruction">矢印はイベントによる遷移です。図は読み取り専用。↔ 狭い画面では横にスクロールできます。</p>
<section class="stx-bottom" aria-label="操作履歴と通信のシーケンス"><div class="stx-bottom-head stx:flex stx:flex-wrap stx:items-center stx:justify-between"><h4 class="stx-heading">操作と通信の記録</h4><a class="stx-nav" href="#stx5-controls">操作へ戻る ↑</a></div><p class="stx-record-intro">イベントごとに、前後の状態と通信を実行順に表示します。予約管理が送信を依頼し、送信処理が配信先へ通知を送ります。状態の直接切替は通信のない区切りです。</p><ol class="stx-records" data-route data-sequence-rows aria-label="初期状態、状態の選択、イベントと通信の時系列"><li id="stx5-current-record" class="stx-record" data-kind="initial" data-step="0" data-occurrence="0" data-state="scheduled" data-current="true"><strong class="stx-record-title">初期状態</strong><p class="stx-record-state">予約中</p></li></ol><p class="stx-count" data-sequence-count>0 回のイベント · 0 件の通信</p><p class="stx-return"><a class="stx-nav" href="#stx5-controls">状態・イベントの操作へ戻る ↑</a></p><p class="stx-footnote">通知を送らない操作例です。履歴はこの例の中だけに残り、回答や下書きには入りません。「初期状態に戻す」かページの再読み込みで、予約中に戻り、履歴と通信を消去します。</p><p class="stx-sr" data-result-announcement role="status" aria-live="polite" aria-atomic="true"></p></section></div></template>
<script>
(() => {
'use strict';
const init=()=>{
const states={scheduled:{label:'予約中',description:'指定した時刻を待っています。指定時刻に進めるか、取り消すことができます。'},sending:{label:'送信中',description:'通知の送信結果を待っています。成功か失敗を返すことができます。'},sent:{label:'送信済み',description:'配信先が通知を受理しました。終端のため、次のイベントはありません。',final:true},failed:{label:'失敗',description:'送信に失敗しました。再試行して送信中へ戻るか、取り消すことができます。'},cancelled:{label:'取消済み',description:'予約を取り消しました。以後は通知を送信しません。終端のため、次のイベントはありません。',final:true}};
const transitions={scheduled:{due:'sending',cancel:'cancelled'},sending:{ok:'sent',fail:'failed'},failed:{retry:'sending',cancel:'cancelled'},sent:{},cancelled:{}};
const events={due:{label:'指定時刻に進める',requirement:'予約中で実行できます'},ok:{label:'成功を返す',requirement:'送信中で実行できます'},fail:{label:'失敗を返す',requirement:'送信中で実行できます'},retry:{label:'再試行する',requirement:'失敗で実行できます'},cancel:{label:'取り消す',requirement:'予約中または失敗で実行できます'}};
const messages={due:[{from:0,to:1,text:'送信を依頼'},{from:1,to:2,text:'通知を送る'}],ok:[{from:2,to:1,text:'受理を返す'},{from:1,to:0,text:'送信済みを記録'}],fail:[{from:2,to:1,text:'失敗を返す'},{from:1,to:0,text:'失敗を記録'}],retry:[{from:0,to:1,text:'送信を再依頼'},{from:1,to:2,text:'通知を送る'}],cancel:[{from:0,to:1,text:'取消を通知'}]};
const actors=['予約管理','送信処理','配信先'];
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)');

document.querySelectorAll('.stx[data-demo="state-transition"]').forEach(root=>{
if(root.dataset.initialized)return;root.dataset.initialized='true';
let currentState='scheduled',history=[];
const find=s=>root.querySelector(s),all=s=>Array.from(root.querySelectorAll(s));
const node=(tag,cls,text)=>{const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el;};
const setText=(s,text)=>{find(s).textContent=text;};
const flash=el=>{if(!el||reduced.matches)return;el.classList.remove('stx-flash');void el.getBoundingClientRect();el.classList.add('stx-flash');};
const renderCurrent=()=>{
root.dataset.currentState=currentState;
all('[data-action="state"]').forEach(b=>{const selected=b.dataset.state===currentState;b.setAttribute('aria-pressed',String(selected));b.setAttribute('aria-label',states[b.dataset.state].label+(selected?'。現在の状態':'に直接切り替える'));});
setText('[data-current-label]',states[currentState].label+(states[currentState].final?'（終端）':''));setText('[data-current-description]',states[currentState].description);
all('[data-action="event"]').forEach(b=>{const key=b.dataset.event,enabled=Object.hasOwn(transitions[currentState],key);b.disabled=!enabled;const reason=enabled?'実行できます':states[currentState].final?'終端のため実行できません':events[key].requirement;b.title=reason;b.setAttribute('aria-label',events[key].label+'。'+reason);});
setText('[data-terminal-note]',states[currentState].final?'終端のためイベントは実行できません。状態名を選ぶと、別の状態から試せます。':'青いボタンで矢印に沿って進みます。状態名を選ぶと、通信せず直接切り替わります。');find('[data-action="reset"]').disabled=!history.length;
const reached=new Set(['scheduled',...history.map(step=>step.to)]);
all('[data-node-state]').forEach(g=>{const key=g.dataset.nodeState;g.dataset.current=String(key===currentState);g.dataset.reached=String(reached.has(key));g.querySelector('[data-node-status]').textContent=key===currentState?'● 現在'+(states[key].final?' · 終端':''):reached.has(key)?'履歴あり'+(states[key].final?' · 終端':''):states[key].final?'終端':'未操作';});
const last=history.at(-1);all('[data-edge-event]').forEach(g=>g.dataset.latest=String(Boolean(last&&last.kind==='event'&&g.dataset.edgeFrom===last.from&&g.dataset.edgeEvent===last.event)));
find('.stx-map').setAttribute('aria-label','予約通知の状態遷移図。現在は'+states[currentState].label+'。'+(last?.kind==='state'?'状態の直接切替では矢印を通りません。':''));
};
const renderResults=()=>{
const records=find('[data-sequence-rows]');records.replaceChildren();let count=0,eventCount=0;
const makeRecord=(step,index)=>{
const row=node('li','stx-record');const current=index===history.length;row.dataset.kind=step?step.kind:'initial';row.dataset.step=String(index);row.dataset.occurrence=String(index);row.dataset.state=step?step.to:'scheduled';row.dataset.current=String(current);row.dataset.latest=String(current);if(current)row.id='stx5-current-record';if(step){row.dataset.from=step.from;row.dataset.to=step.to;if(step.kind==='event')row.dataset.event=step.event;}
const heading=node('div','stx-record-head');const title=!step?'初期状態':step.kind==='state'?String(index)+' · 状態を選択：'+states[step.to].label:String(index)+' · '+events[step.event].label;heading.append(node('strong','stx-record-title',title));if(current)heading.append(node('span','stx-record-current','● 現在の状態'));row.append(heading);
const stateLine=node('p','stx-record-state');if(step){stateLine.append(node('span','',states[step.from].label+' → '),node('strong','',states[step.to].label));}else stateLine.append(node('strong','','予約中'));row.append(stateLine);
if(!step){row.append(node('p','stx-record-note',history.length?'ここから記録を開始しました。':'まだイベントを実行していません。上の操作欄から試せます。'));return row;}
if(step.kind==='state'){row.append(node('p','stx-record-note','通信なし · 状態を直接切り替えました。'));return row;}
eventCount++;const communication=node('div','stx-communication');communication.setAttribute('role','group');communication.setAttribute('aria-label',events[step.event].label+'で実行した通信');const actorRow=node('div','stx-actor-row');actors.forEach(actor=>actorRow.append(node('span','',actor)));communication.append(actorRow);
messages[step.event].forEach((message,mi)=>{count++;const msg=node('div','stx-message');msg.dataset.message=step.event+'-'+String(mi+1);msg.dataset.fromActor=actors[message.from];msg.dataset.toActor=actors[message.to];const left=Math.min(message.from,message.to)*100/3+100/6,right=100-(Math.max(message.from,message.to)*100/3+100/6);msg.style.setProperty('--stx-left',String(left)+'%');msg.style.setProperty('--stx-right',String(right)+'%');msg.style.setProperty('--stx-mid',String((left+100-right)/2)+'%');const label=node('span','stx-message-text',message.text),wire=node('span','stx-message-wire');label.setAttribute('aria-hidden','true');wire.setAttribute('aria-hidden','true');wire.dataset.direction=message.to>message.from?'forward':'back';msg.append(label,wire,node('span','stx-sr','通信'+String(count)+'：'+actors[message.from]+'から'+actors[message.to]+'へ、'+message.text+'。'));communication.append(msg);});row.append(communication);return row;
};records.append(makeRecord(null,0));history.forEach((step,index)=>records.append(makeRecord(step,index+1)));setText('[data-sequence-count]',eventCount+' 回のイベント · '+count+' 件の通信 · 状態の直接切替 '+history.filter(s=>s.kind==='state').length+' 回');
};
const render=()=>{renderCurrent();renderResults();};
root.addEventListener('click',event=>{
const button=event.target.closest('button[data-action]');if(!button||!root.contains(button)||button.disabled)return;
if(button.dataset.action==='state'){const to=button.dataset.state;if(!Object.hasOwn(states,to)||to===currentState)return;history.push({kind:'state',from:currentState,to});currentState=to;render();setText('[data-result-announcement]','状態を直接選択しました。現在は'+states[currentState].label+'。通信は発生していません。');}
else if(button.dataset.action==='event'){const key=button.dataset.event;if(!Object.hasOwn(transitions[currentState],key))return;const to=transitions[currentState][key];history.push({kind:'event',from:currentState,event:key,to});currentState=to;render();setText('[data-result-announcement]',events[key].label+'を実行。現在は'+states[currentState].label+'。前後の状態と通信を記録に追加しました。');}
else if(button.dataset.action==='reset'){history=[];currentState='scheduled';render();all('.stx-flash').forEach(el=>el.classList.remove('stx-flash'));setText('[data-result-announcement]','予約中に戻し、履歴と通信を消去しました。');return;}
else return;
flash(find('[data-current-description-panel]'));flash(find('[data-node-state="'+currentState+'"] .stx-node-box'));flash(find('[data-sequence-rows] [data-latest="true"]'));
});
root.addEventListener('animationend',event=>{if(event.animationName==='stx-emphasis')event.target.classList.remove('stx-flash');});reduced.addEventListener('change',()=>{if(reduced.matches)all('.stx-flash').forEach(el=>el.classList.remove('stx-flash'));});render();
});
};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
})();
</script>
