<script data-scope="figures">
(() => {
  function setup() {
    document.querySelectorAll('.ft-canvas').forEach(demo => {
      if (demo.dataset.ready) return;
      demo.dataset.ready = 'true';
      const toggle = demo.querySelector('[data-toggle]');
      const pane = demo.querySelector('aside');
      const layout = demo.querySelector('[data-layout]');
      function setOpen(open) {
        toggle.setAttribute('aria-expanded', String(open));
        toggle.querySelector('[data-label]').textContent = demo.closest('#toggle-bottom') ? (open ? '脚注を隠す' : '脚注を表示') : (open ? '脚注・補足を隠す' : '脚注・補足を表示');
        toggle.querySelector('[data-chevron]').textContent = open ? '−' : '＋';
        pane.hidden = !open;
        layout.dataset.open = String(open);
      }
      toggle.addEventListener('click', () => setOpen(toggle.getAttribute('aria-expanded') !== 'true'));
      demo.querySelector('[data-return]').addEventListener('click', event => {
        event.preventDefault(); toggle.focus({preventScroll:true}); toggle.scrollIntoView({block:'nearest',behavior:'smooth'});
      });
      setOpen(false);
    });
  }
  setup();
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', setup, {once:true});
})();
</script>
