---
# 未解決エントリの書き方の例。この内容が一覧へ入ることはない。
# 一覧は空 (entries: []) で作られ、entry skill が 1 件ずつ追記する。
# 8 項目は増やさない。各項目の意味は skills/entry/SKILL.md の「エントリの型」にある。
entries:
- id: example-unresolved-entry
  title: 例 1 行のタイトル。何が起きるかを書く
  summary: |
    例 実測した事実だけを書く。公式ドキュメントの記述は summary ではなく refs に置く。
    ここは書き方の例なので、中身に意味は無い。
  affected: 例 v2.1.100〜（changelog で確認した範囲。不明なら「不明、v{現在} で実測」）
  refs:
  - https://github.com/anthropics/claude-code/issues/00000
  dependents:
  - '例 {ワークアラウンドを担う plugin / skill / rule とファイル・節}: {解除時にそこをどうするか}'
  how_to_verify: |
    例 誰が実行しても同じ結果が出る再現手順と、期待結果を書く。
    期待結果と違う結果が出たら解除候補になる。
    プローブファイルを作るなら名前を .known-issues-probe-{id} にし、手順の最後に消す。
  log:
  - '例 YYYY-MM-DD: 確認したことと結果'
