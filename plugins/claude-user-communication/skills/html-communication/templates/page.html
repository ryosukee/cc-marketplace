<!DOCTYPE html>
<html lang="ja">
<!--
  claude-html-communication ページ雛形。head（CSS）と script を持ち、本文は持たない。
  本文は生成元 JSON（src/{file}.json）から scripts/assemble-page.mjs が組み立てて本文のスロットに入れる。
  本文の markup（見出し・範囲・設問カード・表・脚注 pane・下部バー）は scripts/lib/page-source.mjs が出す。
  この雛形も生成した HTML も手で編集しない。直すのは JSON か、この雛形の CSS / script か、page-source.mjs。

  二重の波括弧で囲んだ語は assemble-page.mjs が埋めるスロット（このコメントには書かない。
  書くと置換がここにも当たる）。タイトル・skill のバージョン・生成元・追加 CSS・図の CSS・
  アイコン・本文・テーマ・下書きキー・設問一覧・回答済み の 11 個。
  雛形は form 用と report 用の script を data-scope で分けて持ち、assemble-page.mjs が使わないほうを落とす。
  form / report の本文の違いは page-source.mjs が持つ。
    form   : 上部の残回答バー、下部の操作欄 #bar（補足・リセットはメニュー内）と設問 pane #q-pane。
             .summary の見出し語は「このフォームについて」
    report : #bar の代わりに #footer-nav。#q-pane と .rng[data-q] は無く、左の列には見出しツリー #toc-pane。
             冒頭ブロックの見出し語は「まとめ」

  1024px 以上は左に設問（report は見出しツリー）、右に広い本文の 2 pane。
  設問欄だけをスクロールし、回答操作は左 pane の下端に置く。
  狭幅では設問を判断材料の直後へ戻し、回答操作は画面下部に置く。
  脚注と補足は本文幅を変えない overlay dialog に出す。
  地の文は 720px まで、図・表・コードは本文列の幅を使う。

  色の役割は 3 つに固定する。増やさない。
    青 --link      = 操作できるもの + 現在地
    地の濃淡        = 構造（見出しの罫・表の罫・区切り）
    琥珀 --mark    = 本文中の要点
  本文テキスト --fg と構造の線 --rule-strong は必ず別トークンにする。
  兼用すると両者のコントラストが 1.00 になり、ダークで区別が消える（実測で確認済み）。

  本文のフォントサイズは 4 段階: 1.4em / 1.15em / 1em / 0.875em。生成元 #ver だけ10px。

  強調は <mark>、引用は <blockquote> を使う（SR が境界を読み上げる。span 装飾より優先）。
  脚注を <footer>、補足を <aside> に入れない。Firefox Reader View が両者を無条件削除する。
  main 内の class / id に次の語を使わない（Readability が部分一致で本文から削る）:
    meta / media / share / related / sidebar / scroll / tags / contact / hidden /
    footer / header / banner / widget / comment / social / extra / menu / promo
-->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>{{タイトル}}</title>
<!-- 生成に使った skill の版。古い雛形で作られたページを参考にしないための目印 -->
<meta name="generator" content="claude-html-communication {{skill のバージョン}}">
<!-- 生成元の JSON と、その内容のハッシュ。check-source.mjs が生成元との食い違いを見る -->
<meta name="source" content="{{生成元}}">
<style>
  :root {
    color-scheme: light dark;
    --bg: #fff; --fg: #1a1a1a; --sub: #585d64;
    --rule: #c8ccd2;            /* 構造の細い罫。装飾なのでコントラスト要件の対象外 */
    --control-border: #7c828b;  /* 入力欄・ボタンの輪郭。WCAG 1.4.11 の 3:1 を満たす */
    --rule-strong: #4a5058;     /* 構造の強い線。--fg とは別インクにする */
    --link: #0b6bcb; --link-fill: #0b6bcb; --on-fill: #fff; --focus: #0b6bcb;
    --mark: #ffd980;            /* 要点の下線。文字の背後に敷く */
    --surface-now: #dfe5ee; --surface-code: #eef0f3;
    --ok: #12703a; --ng: #b42318;
    --tw-shadow: rgba(0, 0, 0, .18);
  }
  /* print に適用されないよう screen を明示する（印刷時のスキーム切替は仕様未定義） */
  @media screen and (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d; --fg: #e6e6e6; --sub: #a0a4ab;
      --rule: #3a3f47; --control-border: #767d87; --rule-strong: #9aa1ab;
      --link: #5aa2e8; --link-fill: #7fb3f0; --on-fill: #0e1116; --focus: #5aa2e8;
      /* ダークでは地より明るい側に置く。地より暗い帯は沈んで見えない */
      --mark: #6f5c33;
      --surface-now: #2d333d; --surface-code: #23272e;
      --ok: #74c489; --ng: #f0998f;
      --tw-shadow: rgba(255, 255, 255, .30);
    }
  }
  * { box-sizing: border-box; }
  html { scroll-padding-bottom: 190px; }  /* 固定バーにフォーカスが隠れるのを防ぐ */
  body { margin: 0; background: var(--bg); color: var(--fg); font-size: 16px; line-height: 1.8;
         word-break: auto-phrase;
         font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", Meiryo, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 24px 20px 190px; }
  h1, h2, h3 { text-wrap: balance; }
  h1 { font-size: 1.4em; letter-spacing: 0.01em; margin-bottom: 6px; }
  /* 見出しの標識は左の縦罫。上の短い罫より、行の頭に線があるほうが節の始まりが分かる。
     構造なので無彩。青にすると現在地の青い縦罫と 2 本並んで役割が読めなくなる */
  h2 { font-size: 1.15em; margin-top: 2.4em; margin-bottom: 10px; letter-spacing: 0.01em;
       scroll-margin-top: 12px;
       border-left: 4px solid var(--rule-strong); padding-left: 9px; }
  h3 { font-size: 1em; font-weight: 700; margin-top: 1.8em; letter-spacing: 0.01em; }
  p { margin: 0 0 1.8em; }   /* 段落間は本文 1 行分。UA 既定の 1em だと行間より狭くなる */
  a { color: var(--link); text-underline-offset: 3px; text-decoration-thickness: 1px; }
  /* リンクと弱いテキストの相互コントラストは 1.26 / 1.01 しかない。下線は装飾ではなく要件 */
  code { background: var(--surface-code); padding: 1px 5px; border-radius: 4px; font-size: 0.875em;
         font-family: "SF Mono", Menlo, monospace; }
  pre { background: var(--surface-code); padding: 10px 12px; border-radius: 6px; overflow-x: auto;
        font-size: 0.875em; line-height: 1.5; }
  /* color を必ず指定する。省くとブラウザ既定の mark { color: MarkText } が残り、
     ダークでは暗い文字色のまま帯に重なって読めなくなる */
  mark { background: linear-gradient(transparent 58%, var(--mark) 58%);
         color: inherit; font-weight: 700; padding: 0 1px; }
  .d { color: var(--sub); font-size: 0.875em; }
  .vnav { font-size: 0.875em; border-bottom: 1px solid var(--rule);
          padding: 0 0 12px; margin: 12px 0 18px; color: var(--sub); }
  /* ラベルは独立した行に置き、コロンを付けない。
     「結論: …」のようにラベルとコロンで段落を作る形は使わない
     （user global rule が AI 口調の定型として禁じている。HTML 報告も適用範囲）。
     ラベルが無くても分かるなら、ラベルごと消して地の文にする */
  .eyebrow { display: block; font-size: 0.875em; font-weight: 700; color: var(--sub);
             letter-spacing: 0.08em; margin: 0 0 2px; }
  .summary { border-left: 3px solid var(--rule-strong); padding: 2px 0 2px 12px;
           margin: 0 0 1.8em; }
  .summary > p { margin: 0; }
  .ok { color: var(--ok); } .ng { color: var(--ng); }
  /* --ok と --ng の相互コントラストは 1.07 / 1.04。色だけでは WCAG 1.4.1 を満たさないので
     セルには必ず記号かテキストを併記する */

  /* 引用は引用専用の記法。ラベル行に出典を載せ、本文末尾に出典行を置かない */
  blockquote { margin: 14px 0 18px; padding: 0 0 0 16px; border-left: 3px solid var(--control-border); }
  blockquote .src { display: block; font-size: 0.875em; color: var(--sub); font-weight: 700;
                    margin-bottom: 6px; letter-spacing: 0.02em; }
  blockquote p { margin: 6px 0; }

  /* 設問のグループ容器。グループ化しないページでは使わない（2 pane の pane 内専用） */
  .qgrp { margin: 0 0 14px; }
  .qgrp-h { font-size: 0.875em; font-weight: 700; color: var(--sub); letter-spacing: 0.06em;
            border-bottom: 1px solid var(--rule); padding: 0 0 2px; margin: 0 0 8px; }
  @media (max-width: 1023.98px) { .qgrp { display: none; } }

  /* 表。2 pane と干渉するので本文カラムより広げない。横スクロールで逃がす */
  .table-wrap { overflow-x: auto;
    background:
      linear-gradient(to right, var(--bg) 70%, transparent) left / 28px 100% no-repeat local,
      linear-gradient(to left, var(--bg) 70%, transparent) right / 28px 100% no-repeat local,
      radial-gradient(farthest-side at 0 50%, var(--tw-shadow), transparent) left / 12px 100% no-repeat scroll,
      radial-gradient(farthest-side at 100% 50%, var(--tw-shadow), transparent) right / 12px 100% no-repeat scroll; }
  .table-wrap:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  table { border-collapse: collapse; width: 100%; min-width: 440px; }
  /* caption は表の下。表の本体を先に見せる。表を語るリード文は本文に置かないので、
     何の一覧かを示すのは caption だけになる */
  caption { caption-side: bottom; text-align: left; font-size: 0.875em; color: var(--sub);
            padding-top: 10px; letter-spacing: 0.02em; }
  th, td { border: none; border-bottom: 1px solid var(--rule); padding: 9px 14px 9px 0;
           text-align: left; vertical-align: top; }
  thead th { border-bottom: 2px solid var(--rule-strong); font-size: 0.875em; letter-spacing: 0.04em; }
  /* 行見出しは th scope="row" にする（支援技術が行と列の交差を読むのに要る）。
     見た目は本文と同じにしたいので、th の既定の太字を戻す */
  tbody th { font-weight: 400; }
  tbody tr:last-child > * { border-bottom: none; }
  tr.key > * { font-weight: 700; }
  tr.key > :first-child { border-left: 3px solid var(--rule-strong); padding-left: 11px; }
  th.num, td.num { font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }

  /* 図のキャプション。表の caption と同じ作法にする。図の下に置き、同じ段と色にする。
     図を語る文は本文に置かない（表と同じ） */
  .fig { margin: 14px 0 20px; }
  .fig > .cap { font-size: 0.875em; color: var(--sub); letter-spacing: 0.02em; margin: 10px 0 0; }
  /* 図の画像は列の幅まで縮め、原寸より引き伸ばさない。原寸は下の viewer で見る */
  .fig img { max-width: 100%; height: auto; }
  .fig img.d2 { display: block; }
  .fig img[data-image-viewer] { cursor: zoom-in; }
  .fig img[data-image-viewer]:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

  /* 図の画像を原寸で確認する共通 viewer。dialog 自体は画面内へ収め、画像がそれより大きい場合は
     #image-viewer-scroll の中だけをスクロールさせる。本文や下部バーを動かさない */
  body.image-viewer-open { overflow: hidden; }
  #image-viewer { width: max-content; max-width: calc(100vw - 24px); max-height: calc(100vh - 24px);
                  padding: 0; border: 1px solid var(--rule-strong); border-radius: 8px;
                  background: var(--bg); color: var(--fg); overflow: hidden; }
  #image-viewer::backdrop { background: rgba(0, 0, 0, 0.72); }
  .image-viewer-shell { display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
                        max-height: calc(100vh - 26px); }
  .image-viewer-head { display: flex; align-items: center; gap: 12px; padding: 8px 10px;
                       border-bottom: 1px solid var(--rule); background: var(--bg); }
  #image-viewer-title { margin: 0; font-size: 0.875em; font-weight: 700; }
  #image-viewer-close { margin-left: auto; background: none; border: 1px solid var(--control-border);
                        color: var(--fg); border-radius: 6px; padding: 7px 10px; cursor: pointer; }
  #image-viewer-close:hover { border-color: var(--link); color: var(--link); }
  #image-viewer-close:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  #image-viewer-scroll { overflow: auto; overscroll-behavior: contain; padding: 12px;
                         background: var(--surface-code); }
  #image-viewer-image { display: block; max-width: none; width: auto; height: auto; }
  #image-viewer-caption { margin: 0; padding: 8px 10px; border-top: 1px solid var(--rule);
                          color: var(--sub); font-size: 0.875em; }

  /* 本文の範囲。1 つの設問の判断材料がどこからどこまでかを示す。
     前提部分は範囲を持たせない（その位置では設問をどれも開かない）。
     既定は細い無彩の縦罫、現在地だけ青 2px に変わる。
     2px ではアクティブと非アクティブが同じ太さになるが、--rule との輝度比が
     ダーク 3.92 / ライト 3.27 あり、WCAG 1.4.1 の「明度でも 3:1 以上」を満たす */
  .rng { position: relative; padding: 10px 0 10px 14px; margin: 26px 0; margin-inline: -14px; }
  .rng::before { content: ""; position: absolute; left: 0; top: 12px; bottom: 14px;
                 width: 2px; border-radius: 1px; background: var(--rule); }
  .rng.on::before { background: var(--link); }
  /* 範囲のラベルは見出しの上に出る補助表示。「設問 2」とだけ書き、
     「設問 2 の判断材料」のように役割を説明しない。読み手が知りたいのは
     いま設問のどれを読んでいるかで、この範囲が何であるかは 2 pane の並びが示している。
     太字にすると節の見出しと強さが並び、どちらが節の名前か分からなくなる。
     最小の段のまま、太さと色で後ろへ下げる */
  .rng > .rlabel { font-size: 0.875em; font-weight: 400; color: var(--sub);
                   letter-spacing: 0.02em; margin: 0 0 2px; }
  .rng > h2 { margin-top: 0.2em; }
  /* 説明セクションの番号。見出しの前の行に出す。設問側は .rlabel が同じ役目を持つ。
     見出しの中に番号を書かないのは、どこまでが番号でどこからがタイトルか分からなくなるため */
  .secnum { display: block; font-size: 0.875em; font-weight: 700; color: var(--sub);
            letter-spacing: 0.08em; margin: 2.4em 0 2px; }
  .secnum + h2 { margin-top: 0; }

  /* 設問カード。読んでいる範囲のものが開く。手で開閉すると自動追従から外れる */
  .qd { border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; margin: 0 0 10px; }
  .qd > summary { cursor: pointer; font-weight: 700; font-size: 0.875em;
                  display: flex; align-items: baseline; gap: 8px; }
  .qd > summary::-webkit-details-marker { display: none; }
  /* details の三角は flex にすると消える環境があるので、自前で描いて位置を固定する */
  .qd > summary::before { content: "\25B8"; flex: none; font-weight: 400; color: var(--sub);
                          transition: none; }
  .qd[open] > summary::before { content: "\25BE"; }
  .qd > summary:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .qd.on { box-shadow: inset 2px 0 0 var(--link); }
  /* 回答済みマーカー。折り畳んだままでも、どこまで答えたかが一覧で分かるようにする。
     色は使わない（色役割は 3 つに固定してあり、状態を表す枠が無い）。
     形（輪郭の丸 / 塗りの丸）と語の両方で区別する。WCAG 1.4.1 も色単独を認めない */
  .qstat { margin-left: auto; flex: none; font-weight: 400; color: var(--sub);
           white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
  .qstat::before { content: ""; width: 9px; height: 9px; border-radius: 50%;
                   border: 1.5px solid var(--control-border); background: var(--bg); }
  .qd.done .qstat::before { background: var(--rule-strong); border-color: var(--rule-strong); }
  .qd.done .qstat { color: var(--fg); }
  .qtext { font-size: 0.875em; margin: 8px 0 0; }

  .q { margin: 8px 0 0; }
  .radio-item { margin: 0; padding: 10px 0; border: 0; border-bottom: 1px solid var(--rule); }
  .radio-item > legend { padding: 0; font-size: 0.875em; font-weight: 700; }
  .radio-item > .d { margin: 4px 0 0; font-size: 0.875em; }
  .radio-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; margin-top: 7px; }
  label.item-radio { display: flex; align-items: center; gap: 7px; min-width: 0; padding: 7px 8px;
                     border: 1px solid var(--control-border); border-radius: 6px; cursor: pointer; font-size: 0.875em; }
  label.item-radio:has(input:checked) { font-weight: 700; border-color: var(--link); }
  label.item-radio input[type="radio"] { appearance: none; -webkit-appearance: none; width: 15px; height: 15px;
      margin: 0; flex: none; border-radius: 50%; border: 1.5px solid var(--control-border); background: var(--bg); }
  label.item-radio input[type="radio"]:checked { border: 5px solid var(--link-fill); }
  label.item-radio input[type="radio"]:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  label.opt { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap;
              padding: 8px 0 8px 2px; border-bottom: 1px solid var(--rule); cursor: pointer;
              font-size: 0.875em; }
  label.opt:has(input:checked) { font-weight: 700; }
  label.opt input[type="radio"], label.opt input[type="checkbox"] { appearance: none; -webkit-appearance: none;
      width: 15px; height: 15px; margin: 0; flex: none; border-radius: 50%;
      border: 1.5px solid var(--control-border); background: var(--bg); transform: translateY(2px); }
  label.opt input[type="radio"]:checked { border: 5px solid var(--link-fill); }
  label.opt input[type="checkbox"] { border-radius: 3px; }
  label.opt input[type="checkbox"]:checked { background: var(--link-fill); border-color: var(--link-fill); }
  label.opt input[type="checkbox"]:checked::after { content: "✓"; display: block; color: var(--on-fill);
      font-size: 0.875em; font-weight: 700; line-height: 12px; text-align: center; }
  label.opt input[type="radio"]:focus-visible, label.opt input[type="checkbox"]:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  label.opt .d { font-weight: 400; width: 100%; }
  /* 選択肢の帰結を長所と短所の 2 行に分ける。色だけに載せず、ラベル語を必ず併記する */
  .proscons { display: block; margin-top: 5px; }
  .proscons > span { display: block; margin-top: 2px; }
  .pro { color: var(--ok); font-weight: 700; margin-right: 4px; }
  .con { color: var(--ng); font-weight: 700; margin-right: 4px; }
  .rec { background: none; color: var(--fg); border: 1px solid var(--fg);
         font-size: 0.875em; border-radius: 4px; padding: 0 6px; margin-left: 4px;
         font-weight: 700; letter-spacing: 0.02em; }
  input.other { width: 100%; margin-top: 4px; padding: 6px 8px; border: 1px solid var(--control-border);
                border-radius: 5px; background: var(--bg); color: var(--fg); font-size: 1em; }
  textarea.note { width: 100%; margin-top: 6px; padding: 6px 8px; border: 1px solid var(--control-border);
                  border-radius: 5px; background: var(--bg); color: var(--fg); font-size: 0.875em;
                  min-height: 30px; resize: vertical; }
  #preview { width: 100%; min-height: 150px; font-family: "SF Mono", Menlo, monospace;
             font-size: 0.875em; background: var(--surface-code); color: var(--fg);
             border: 1px solid var(--control-border); border-radius: 6px; padding: 10px; }

  /* 脚注と補足。どちらも本文と双方向のページ内リンクにする。
     番号の系列を混ぜない。脚注は数字 (1, 2)、補足は英字 (a, b) */
  .pane-h { font-size: 0.875em; font-weight: 700; color: var(--sub); margin: 0 0 8px;
            letter-spacing: 0.04em; }
  .fn, .su { font-size: 0.875em; margin: 0 0 10px; scroll-margin-top: 16px; }
  /* .is-target は 2 pane 以上で JS が pane の中だけを動かしたときの着地点。:target と同じ見た目にする */
  .fn:target, .su:target, .fn.is-target, .su.is-target {
    background: var(--surface-now); border-radius: 4px; box-shadow: 0 0 0 4px var(--surface-now); }
  .fnnum, .sunum { text-decoration: none; font-weight: 700; }
  .fnback, .suback { text-decoration: none; margin-left: 3px; }
  .fnback:hover, .suback:hover { text-decoration: underline; }
  .fnref, .suref { font-size: 0.875em; scroll-margin-top: 16px; }
  .fnref a { text-decoration: none; padding: 0 1px; }
  .fnref a:hover { text-decoration: underline; }
  .fnref:target a { background: var(--surface-now); outline: 2px solid var(--focus); border-radius: 3px; }

<script>
/* .fig 内の bitmap 画像は共通 viewer で原寸確認できるようにする。
   ページ固有の figures ファイルには操作用 JS を持たせない。 */
(function () {
  var dialog = document.getElementById('image-viewer');
  var viewer = document.getElementById('image-viewer-image');
  var caption = document.getElementById('image-viewer-caption');
  var scroll = document.getElementById('image-viewer-scroll');
  var close = document.getElementById('image-viewer-close');
  if (!dialog || !viewer || !caption || !scroll || !close || typeof dialog.showModal !== 'function') return;

  var opener = null;
  var emptyImage = viewer.src;
  function openImage(img) {
    opener = img;
    viewer.src = img.currentSrc || img.src;
    viewer.alt = img.alt || '';
    var cap = img.closest('.fig');
    cap = cap && cap.querySelector('.cap');
    caption.textContent = cap ? cap.textContent : (img.alt || '');
    scroll.scrollTop = 0;
    scroll.scrollLeft = 0;
    if (!dialog.open) dialog.showModal();
    document.body.classList.add('image-viewer-open');
    close.focus();
  }
  function closeImage() {
    if (dialog.open) dialog.close();
  }

  [].slice.call(document.querySelectorAll('.fig img')).forEach(function (img) {
    if (img.closest('a, button')) return;
    img.dataset.imageViewer = 'true';
    img.tabIndex = 0;
    img.setAttribute('role', 'button');
    img.setAttribute('aria-haspopup', 'dialog');
    img.setAttribute('aria-label', (img.alt || '画像') + 'を拡大表示');
    img.addEventListener('click', function () { openImage(img); });
    img.addEventListener('keydown', function (event) {
      if (event.key !== 'Enter' && event.key !== ' ') return;
      event.preventDefault();
      openImage(img);
    });
  });

  close.addEventListener('click', closeImage);
  dialog.addEventListener('click', function (event) { if (event.target === dialog) closeImage(); });
  dialog.addEventListener('close', function () {
    document.body.classList.remove('image-viewer-open');
    viewer.src = emptyImage;
    if (opener && opener.isConnected) opener.focus();
    opener = null;
  });
})();

(function () {

  popupBody.addEventListener('click', function (event) {

<script data-scope="layout">
/* 2 pane と脚注 dialog。入力・脚注の原文ノードを移し、複製しない。 */
(() => {
  'use strict';
  document.body.classList.add('page-layout');
  const pane = document.getElementById('q-pane');
  const bar = document.getElementById('bar');
  const menu = document.getElementById('answer-menu');
  if (pane && bar && menu) {
    const menuActions = document.createElement('div');
    menuActions.className = 'answer-menu-actions';
    menuActions.append(menu.querySelector('#reset'));
    bar.querySelector('#bar-in').append(bar.querySelector('#back'));
    menu.append(menuActions);
    const list = document.createElement('div');
    list.id = 'question-list';
    while (pane.firstChild) list.append(pane.firstChild);
    pane.append(list);
    const home = document.createComment('answer-controls-home');
    bar.before(home);
    const wide = matchMedia('(min-width: 1024px)');
    const place = () => {
      if (wide.matches) pane.append(bar);
      else home.after(bar);
    };
    wide.addEventListener('change', place);
    place();
    // The auxiliary menu must not be clipped by the questions' scroll area.
    document.body.append(menu);
    const positionMenu = () => {
      if (menu.hidden) return;
      const rect = bar.getBoundingClientRect();
      const width = Math.min(420, innerWidth - 24);
      menu.style.width = width + 'px';
      menu.style.left = Math.max(12, Math.min(rect.left, innerWidth - width - 12)) + 'px';
      menu.style.right = 'auto';
      menu.style.bottom = Math.max(12, innerHeight - rect.top + 8) + 'px';
      menu.style.maxHeight = Math.max(160, rect.top - 24) + 'px';
    };
    new MutationObserver(positionMenu).observe(menu, { attributes: true, attributeFilter: ['hidden'] });
    addEventListener('resize', positionMenu);
  }
  const notes = document.getElementById('fn-pane');
  const toggle = document.getElementById('fn-toggle');
  if (!notes || !toggle) return;
  const home = document.createComment('footnotes-home');
  notes.before(home);
  const drawer = document.createElement('dialog');
  drawer.id = 'fn-drawer';
  drawer.setAttribute('aria-labelledby', 'fn-drawer-title');
  const top = document.createElement('div'); top.className = 'fn-drawer-top';
  const heading = document.createElement('h2'); heading.id = 'fn-drawer-title'; heading.textContent = '脚注と補足';
  const close = document.createElement('button'); close.type = 'button'; close.className = 'subbtn'; close.textContent = '閉じる';
  top.append(heading, close); drawer.append(top, notes); document.body.append(drawer);
  if (typeof drawer.showModal !== 'function') { drawer.remove(); home.after(notes); return; }
  notes.hidden = false;
  toggle.hidden = false; toggle.setAttribute('aria-controls', 'fn-drawer');
  toggle.setAttribute('aria-haspopup', 'dialog'); toggle.setAttribute('aria-expanded', 'false');
  let opener = toggle, focusTarget = null, printing = false, closeHandled = true;
  const focusWithoutPreview = target => document.dispatchEvent(new CustomEvent('reference-focus', { detail: target }));
  const open = (target, source) => {
    if (!drawer.open) {
      opener = source || document.activeElement;
      const popupClose = document.getElementById('reading-popup-close');
      if (!document.getElementById('reading-popup').hidden) popupClose.click();
      drawer.showModal();
      closeHandled = false;
      document.documentElement.classList.add('fn-drawer-open');
      toggle.setAttribute('aria-expanded', 'true');
      close.focus({ preventScroll: true });
    }
    notes.querySelectorAll('.note-target').forEach(note => note.classList.remove('note-target'));
    if (target) {
      target.classList.add('note-target');
      notes.scrollTo({ top: notes.scrollTop + target.getBoundingClientRect().top - notes.getBoundingClientRect().top - 12 });
      target.setAttribute('tabindex', '-1');
      focusWithoutPreview(target);
    }
  };
  document.addEventListener('footnote-request', event => {
    const target = document.getElementById(event.detail.id);
    if (target && notes.contains(target)) open(target, event.detail.opener);
  });
  const finishClose = () => {
    if (closeHandled || drawer.open) return;
    closeHandled = true;
    // Native focus restoration happens during close(), before the queued close event.
    if (!document.getElementById('reading-popup').hidden) document.getElementById('reading-popup-close').click();
    document.documentElement.classList.remove('fn-drawer-open');
    toggle.setAttribute('aria-expanded', 'false');
    if (!printing) focusWithoutPreview(focusTarget || (opener?.isConnected ? opener : toggle));
    focusTarget = null;
  };
  const shut = (target = null) => {
    focusTarget = target;
    if (drawer.open) drawer.close();
    finishClose();
  };
  toggle.addEventListener('click', () => open());
  close.addEventListener('click', () => shut());
  drawer.addEventListener('cancel', event => { event.preventDefault(); shut(); });
  drawer.addEventListener('click', event => {
    if (event.target !== drawer) return;
    const r = drawer.getBoundingClientRect();
    if (event.clientX < r.left || event.clientX > r.right || event.clientY < r.top || event.clientY > r.bottom) shut();
  });
  drawer.addEventListener('close', finishClose);
  notes.addEventListener('click', event => {
    const link = event.target.closest('a[href^="#"]');
    if (!link || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
    const target = document.getElementById(link.hash.slice(1));
    if (!target || notes.contains(target)) return;
    event.preventDefault();
    target.setAttribute('tabindex', '-1');
    const focus = target.matches('.fnref, .suref') ? target.querySelector('a') || target : target;
    shut(focus);
    requestAnimationFrame(() => { target.scrollIntoView({ block: 'center' }); focusWithoutPreview(focus); });
  });
  const revealHash = () => {
    const target = document.getElementById(location.hash.slice(1));
    if (target && notes.contains(target)) open(target);
  };
  addEventListener('hashchange', revealHash);
  revealHash();
  addEventListener('beforeprint', () => {
    printing = true;
    shut();
    home.after(notes);
    notes.hidden = false;
  });
  addEventListener('afterprint', () => {
    drawer.append(notes);
    printing = false;
  });
})();

</script>
<script data-scope="report">
/* report の見出しツリーの現在地。report の節は要素で包まれていないので、h2 の位置で決める。
   読み位置の線は form 用の追従と同じ画面の上から 35% にして、2 つの判定をずらさない。 */
(function () {
  var pane = document.getElementById('toc-pane');
  if (!pane) return;
  var links = [].slice.call(pane.querySelectorAll('a'));
  if (!links.length) return;
  var heads = links.map(function (a) { return document.querySelector(a.getAttribute('href')); });
  function spy() {
    var line = window.innerHeight * 0.35, cur = 0;
    heads.forEach(function (h, i) { if (h && h.getBoundingClientRect().top <= line) cur = i; });
    links.forEach(function (a, i) {
      a.classList.toggle('on', i === cur);
      if (i === cur) a.setAttribute('aria-current', 'true');
      else a.removeAttribute('aria-current');
    });
    /* 項目が多いと現在地が pane の表示領域から出る。pane の中だけを動かして見える位置へ戻す */
    var pr = pane.getBoundingClientRect(), ar = links[cur].getBoundingClientRect();
    if (ar.top < pr.top) pane.scrollTop -= pr.top - ar.top;
    else if (ar.bottom > pr.bottom) pane.scrollTop += ar.bottom - pr.bottom;
  }
  window.addEventListener('scroll', spy, { passive: true });
  window.addEventListener('resize', spy);
  spy();
})();
</script>
<script data-scope="form">
(function () {
  var THEME = {{テーマ}};
  var KEY = {{下書きキー}};
  var QS = {{設問一覧}};
  /* 回答を受領したページは静的に回答済みで組まれる。下書きの保存・復元とリセットは止め、コピーだけ残す */
  var ANSWERED = {{回答済み}};

  // 受領/コピー失敗の長いメッセージで操作欄の高さが変わっても、本文末尾を隠さない。
  var answerBar = document.getElementById('bar');
  function measureBar() {
    document.documentElement.style.setProperty('--answer-bar-height', answerBar.getBoundingClientRect().height + 'px');
  }
  if (typeof ResizeObserver === 'function') new ResizeObserver(measureBar).observe(answerBar);
  else window.addEventListener('resize', measureBar);
  measureBar();

  var menu = document.getElementById('answer-menu');
  var menuToggle = document.getElementById('answer-menu-toggle');
  function closeMenu(restoreFocus) {
    menu.hidden = true;
    menuToggle.setAttribute('aria-expanded', 'false');
    if (restoreFocus) menuToggle.focus();
  }
  menuToggle.addEventListener('click', function () {
    if (!menu.hidden) { closeMenu(false); return; }
    menu.hidden = false;
    menuToggle.setAttribute('aria-expanded', 'true');
    document.getElementById(ANSWERED ? 'answer-menu-close' : 'free').focus({ preventScroll: true });
  });
  document.getElementById('answer-menu-close').addEventListener('click', function () { closeMenu(true); });
  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape' && !menu.hidden) { event.preventDefault(); closeMenu(true); }
  });
  document.addEventListener('click', function (event) {
    if (!menu.hidden && !menu.contains(event.target) && !menuToggle.contains(event.target)) closeMenu(false);
  });

  var ranges = [].slice.call(document.querySelectorAll('.rng[data-q]'));
  var qds = [].slice.call(document.querySelectorAll('.qd[data-for]'));

  /* 設問カードの置き場を画面幅で切り替える。2 pane では左 pane、それ以外は本文の
     判断材料の直後。DOM ノードを移すだけなので入力値も下書きも保たれる。
     本文側の位置はコメントノードで覚えておく（兄弟が動いても戻せる）。 */
  var wideQuestions = window.matchMedia('(min-width: 1024px)');
  var printQuestions = window.matchMedia('print');
  var questionsPrinting = printQuestions.matches;
  qds.forEach(function (d) {
    var home = document.createComment('qd-home:' + d.dataset.for);
    d.parentNode.insertBefore(home, d);
    d.__home = home;
  });
  function place() {
    var pane = document.getElementById('question-list');
    if (questionsPrinting || !wideQuestions.matches) {
      /* 印刷と狭幅では判断材料の直後へ戻す。 */
      qds.forEach(function (d) {
        if (d.parentNode === pane || (d.parentNode && d.parentNode.classList &&
            d.parentNode.classList.contains('qgrp'))) {
          d.__home.parentNode.insertBefore(d, d.__home);
        }
      });
      return;
    }
    /* 2 pane では本文の順（qds の並び）で pane に置く。グループ容器はそのグループの
       最初のカードが来る位置へ移し、同じグループの後続カードはその容器へ入る。
       グループ外のカードは pane 直下に置く。容器を pane に書いた順は並びに効かない。
       末尾へ積むだけだと、グループ外のカードが全グループより後ろに来て番号順が崩れる。
       既に望む位置にあるノードは動かさない（動かすと入力中の focus が外れる） */
    var last = {};
    function put(box, node) {
      var key = box === pane ? '' : box.dataset.grp;
      if (!(key in last)) last[key] = box.querySelector(box === pane ? '.pane-h' : '.qgrp-h');
      var ref = last[key] ? last[key].nextElementSibling : box.firstElementChild;
      if (node !== ref) box.insertBefore(node, ref);
      last[key] = node;
    }
    qds.forEach(function (d) {
      var g = d.dataset.grp ? pane.querySelector('.qgrp[data-grp="' + d.dataset.grp + '"]') : null;
      if (!g) { put(pane, d); return; }
      if (!(g.dataset.grp in last)) put(pane, g);
      put(g, d);
    });
  }

  /* 読んでいる範囲の追従。各範囲と表示領域の重なりの高さで決める。
     節の先頭が閾値を超えたかという点の判定はしない（範囲と重なりで見る）。 */
  var pinned = {};
  var lastBest = null;
  function follow() {
    if (questionsPrinting || !ranges.length) return;
    var vh = window.innerHeight, best = null, bestOv = 0;
    /* 読み位置は画面の上から 35%。まずその線を含む範囲を採り、
       どの範囲も含まなければ重なりが最大の範囲へ落とす。
       重なりだけで決めると、背の高い画面では次の範囲のほうが重なりが大きくなり、
       読み始めた範囲ではなく 1 つ先が現在地になる（実測で確認）。
       節の先頭が閾値を超えたかという点の判定はしない。範囲が読み位置を含むかで見る。 */
    var line = vh * 0.35;
    ranges.forEach(function (r) {
      var b = r.getBoundingClientRect();
      var ov = Math.max(0, Math.min(b.bottom, vh) - Math.max(b.top, 0));
      if (b.top <= line && b.bottom >= line) { best = r; bestOv = Infinity; }
      else if (bestOv !== Infinity && ov > bestOv) { bestOv = ov; best = r; }
    });
    /* 読んでいる範囲が変わったら手動の開閉を解除して自動追従へ戻す。
       解除しないと、一度手で開閉しただけで以後ずっと追従しなくなる */
    if (best !== lastBest) { pinned = {}; lastBest = best; }
    ranges.forEach(function (r) { r.classList.toggle('on', r === best); });
    qds.forEach(function (d) {
      var on = !!(best && d.dataset.for === best.dataset.q);
      d.classList.toggle('on', on);
      /* 折り畳みは 2 pane の pane を短く保つための仕掛け。
         本文中に置かれているときは位置そのものが対応を示すので常に開く */
      if (!wideQuestions.matches) { d.open = true; return; }
      if (!pinned[d.dataset.for]) d.open = on;
    });
  }
  /* 手動と見なすのは summary のクリックだけ。選択肢に触れただけで追従が止まると、
     回答した瞬間に自動開閉が効かなくなる */
  qds.forEach(function (d) {
    var sm = d.querySelector('summary');
    if (sm) sm.addEventListener('click', function () { pinned[d.dataset.for] = true; });
  });
  function relayout() { place(); follow(); }
  function printPlacement(printing) { questionsPrinting = printing; place(); }
  window.addEventListener('beforeprint', function () { printPlacement(true); });
  window.addEventListener('afterprint', function () { printPlacement(false); });
  function printMediaChanged(event) { printPlacement(event.matches); }
  if (printQuestions.addEventListener) printQuestions.addEventListener('change', printMediaChanged);
  else if (printQuestions.addListener) printQuestions.addListener(printMediaChanged);
  if (wideQuestions.addEventListener) wideQuestions.addEventListener('change', relayout);
  else if (wideQuestions.addListener) wideQuestions.addListener(relayout);
  window.addEventListener('scroll', follow, { passive: true });
  window.addEventListener('resize', relayout);
  relayout();

  function ans(qid) {
    var group = document.getElementById(qid);
    if (group && group.dataset.itemRadios === 'true') {
      var data = {}, any = false;
      group.querySelectorAll('.radio-item').forEach(function (item) {
        var checked = item.querySelector('input[type="radio"]:checked');
        data[item.dataset.item] = checked ? checked.value : null;
        if (checked) any = true;
      });
      return any ? '項目別選択: ' + JSON.stringify(data) : null;
    }
    if (group && group.dataset.multiple === 'true') {
      var checked = [].slice.call(group.querySelectorAll('input[type="checkbox"]:checked'));
      if (!checked.length) return null;
      var data = { values: checked.filter(function (c) { return c.value !== '__other__'; }).map(function (c) { return c.value; }) };
      if (checked.some(function (c) { return c.value === '__other__'; })) {
        var other = group.querySelector('.other');
        data.other = other ? other.value.trim() : '';
      }
      return '複数選択: ' + JSON.stringify(data);
    }
    var c = document.querySelector('input[name="' + qid + '"]:checked');
    if (!c) return null;
    if (c.value === '__other__') {
      var o = document.querySelector('.other[data-for="' + qid + '"]');
      return (o && o.value.trim()) ? 'その他: ' + o.value.trim() : 'その他（記述なし）';
    }
    return c.value;
  }
  function complete(qid) {
    var group = document.getElementById(qid);
    if (group && group.dataset.itemRadios === 'true') {
      var items = [].slice.call(group.querySelectorAll('.radio-item'));
      return items.length > 0 && items.every(function (item) { return !!item.querySelector('input[type="radio"]:checked'); });
    }
    return !!ans(qid);
  }
  function build() {
    var lines = ['## HTML フォーム回答（' + THEME + '）'], n = 0;
    QS.forEach(function (q, i) {
      var a = ans(q.id);
      if (complete(q.id)) n++;
      var note = document.querySelector('.note[data-note="' + q.id + '"]');
      var nt = note && note.value.trim();
      lines.push('- Q' + (i + 1) + '（' + q.label + '）: ' + (a || '未回答') + (nt ? '  ※ ' + nt : ''));
    });
    var free = document.getElementById('free').value.trim();
    lines.push('- 補足: ' + (free || 'なし'));
    var feedback = window.HTMLCodeFeedback && window.HTMLCodeFeedback.export();
    if (feedback && feedback.length) lines.push('- 対象別提案: ' + JSON.stringify(feedback));
    return { text: lines.join('\n'), n: n, total: QS.length };
  }
  function saveDraft() {
    var d = { radios: {}, checkboxes: {}, texts: {} };
    document.querySelectorAll('input[type="radio"]:checked').forEach(function (r) { d.radios[r.name] = r.value; });
    document.querySelectorAll('input[type="checkbox"]:checked').forEach(function (c) {
      var question = c.dataset.question;
      if (!d.checkboxes[question]) d.checkboxes[question] = [];
      d.checkboxes[question].push(c.value);
    });
    document.querySelectorAll('.other').forEach(function (o) { if (o.value) d.texts['o:' + o.dataset.for] = o.value; });
    document.querySelectorAll('.note[data-note]').forEach(function (t) { if (t.value) d.texts['n:' + t.dataset.note] = t.value; });
    var free = document.getElementById('free').value;
    if (free) d.texts['free'] = free;
    if (window.HTMLCodeFeedback) d.feedback = window.HTMLCodeFeedback.snapshot();
    try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {}
  }
  function applyDraft(d) {
    if (window.HTMLCodeFeedback && Array.isArray(d.feedback)) window.HTMLCodeFeedback.restoreDraft(d.feedback);
    Object.keys(d.radios || {}).forEach(function (name) {
      var el = document.querySelector('input[name="' + name + '"][value="' + CSS.escape(d.radios[name]) + '"]');
      if (el) el.checked = true;
    });
    Object.keys(d.checkboxes || {}).forEach(function (name) {
      if (!Array.isArray(d.checkboxes[name])) return;
      document.querySelectorAll('input[type="checkbox"]').forEach(function (el) {
        if (el.dataset.question === name && d.checkboxes[name].includes(el.value)) el.checked = true;
      });
    });
    Object.keys(d.texts || {}).forEach(function (k) {
      if (k === 'free') { document.getElementById('free').value = d.texts[k]; return; }
      var kind = k.slice(0, 2), id = k.slice(2);
      var el = kind === 'o:' ? document.querySelector('.other[data-for="' + id + '"]')
                             : document.querySelector('.note[data-note="' + id + '"]');
      if (el) el.value = d.texts[k];
    });
  }
  function refresh() {
    var r = build();
    document.getElementById('preview').value = r.text;
    var remaining = r.total - r.n;
    document.getElementById('remaining').textContent = '残り ' + remaining + ' / ' + r.total + ' 問';
    var track = document.getElementById('remaining-track');
    track.value = remaining;
    track.setAttribute('aria-valuetext', '残り ' + remaining + ' / ' + r.total + ' 問');
    /* 折り畳んだままでも回答済みが分かるように、カードの状態を更新する。
       判定は上部の残回答バーと同じで、選択肢を選んだら回答済み（補足欄だけの記入は未回答） */
    qds.forEach(function (d) {
      var done = complete(d.dataset.for);
      d.classList.toggle('done', done);
      var st = d.querySelector('.qstat');
      if (st) st.textContent = done ? '回答済み' : '未回答';
    });
    /* グループ見出しの回答進捗。グループ化しないページでは .qgrp が無く何もしない */
    [].slice.call(document.querySelectorAll('#q-pane .qgrp')).forEach(function (box) {
      var members = qds.filter(function (d) { return d.dataset.grp === box.dataset.grp; });
      var done = members.filter(function (d) { return complete(d.dataset.for); }).length;
      var h = box.querySelector('.qgrp-h');
      if (h) h.textContent = h.getAttribute('data-grp-name') + ' ' + done + '/' + members.length;
    });
  }
  // クリップボードはクリック直後に同期で呼ぶ。await を挟むと Safari / Firefox が
  // user activation を失って NotAllowedError で reject する。
  var receivedMessage = document.getElementById('res').textContent;
  var copyButton = document.getElementById('copy');
  var copyButtonLabel = copyButton.textContent;
  var copyMessageTimer = null;
  function copyText(text) {
    var res = document.getElementById('res');
    clearTimeout(copyMessageTimer);
    function ok() {
      clearTimeout(copyMessageTimer);
      copyButton.textContent = 'コピーしました';
      res.classList.add('copy-success');
      res.textContent = 'コピーしました';
      copyMessageTimer = setTimeout(function () {
        copyButton.textContent = copyButtonLabel;
        res.classList.remove('copy-success');
        res.textContent = receivedMessage;
      }, 3000);
    }
    function ng() {
      clearTimeout(copyMessageTimer);
      copyButton.textContent = copyButtonLabel;
      res.classList.remove('copy-success');
      var p = document.getElementById('preview');
      p.scrollIntoView({ behavior: 'smooth' }); p.focus(); p.select();
      res.textContent = 'コピーできません。回答のテキスト欄から手動でコピーしてください';
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, ng);
    else ng();
  }

  document.addEventListener('input', function () { if (!ANSWERED) saveDraft(); refresh(); });
  document.addEventListener('change', function () { if (!ANSWERED) saveDraft(); refresh(); });
  document.addEventListener('rich-feedback-change', function () { if (!ANSWERED) saveDraft(); refresh(); });
  document.getElementById('copy').addEventListener('click', function () { copyText(build().text); });
  document.getElementById('reset').addEventListener('click', function () {
    if (ANSWERED) return;
    try { localStorage.removeItem(KEY); } catch (e) {}
    document.querySelectorAll('input[type="radio"], input[type="checkbox"]').forEach(function (r) { r.checked = false; });
    document.querySelectorAll('.other, .note[data-note]').forEach(function (t) { t.value = ''; });
    document.getElementById('free').value = '';
    if (window.HTMLCodeFeedback) window.HTMLCodeFeedback.reset();
    refresh();
    closeMenu(true);
  });

  if (!ANSWERED) { try { var raw = localStorage.getItem(KEY); if (raw) applyDraft(JSON.parse(raw)); } catch (e) {} }
  refresh();
})();
</script>
</body>
