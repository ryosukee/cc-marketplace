schema_version: "1.1"
name: pos-01-resume-work
description: いま何をやっている途中だったかを聞く依頼で plane-kanban が発動するか
tags: [description, positive]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 少し間が空いちゃったんだけど、この前どこまで進めてたんだっけ。続きから再開したい。
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
runs: 3
graders:
  - name: kanban-skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?plane-kanban"'
    min: 1
  - name: setup-skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?plane-kanban-setup"'
    min: 0
    max: 0
