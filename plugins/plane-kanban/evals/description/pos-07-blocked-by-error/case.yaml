schema_version: "1.1"
name: pos-07-blocked-by-error
description: 作業を見ようとしたら API key 不足のエラーで止まり、plane-kanban-setup へ案内される依頼か。plane-kanban 自体の発動は許す
tags: [description, positive]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: いま抱えている作業の一覧を見せて。
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
runs: 3
graders:
  - name: setup-skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?plane-kanban-setup"'
    min: 1
