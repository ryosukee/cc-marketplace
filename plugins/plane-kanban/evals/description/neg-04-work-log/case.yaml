schema_version: "1.1"
name: neg-04-work-log
description: 作業ログを notes のファイルに書かせるだけの依頼で、どちらの skill も発動しないこと
tags: [description, negative, boundary]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 今日やったことをnotesのファイルに作業ログとして書いておいて。
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
runs: 3
graders:
  - name: kanban-skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?plane-kanban"'
    min: 0
    max: 0
  - name: setup-skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?plane-kanban-setup"'
    min: 0
    max: 0
