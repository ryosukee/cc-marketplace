schema_version: "1.1"
name: pos-06-new-repo-setup
description: 新しく作った repo でもいつもの管理を使えるようにしたい依頼で plane-kanban-setup が発動するか
tags: [description, positive]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: この新しく作ったrepoでも、いつもみたいにタスクの管理をできるようにしておきたい。
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
runs: 3
graders:
  - name: setup-skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?plane-kanban-setup"'
    min: 1
  - name: kanban-skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?plane-kanban"'
    min: 0
    max: 0
