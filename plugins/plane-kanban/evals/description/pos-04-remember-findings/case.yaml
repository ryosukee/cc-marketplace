schema_version: "1.1"
name: pos-04-remember-findings
description: レビュー指摘を忘れないように残したい依頼（3件を列挙）で plane-kanban が発動するか
tags: [description, positive]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: さっきのレビューで出た、①エラーハンドリングの漏れ、②命名の不統一、③テストケース不足、の3つを忘れないように残しておきたい。
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
runs: 3
graders:
  - name: kanban-skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?plane-kanban"'
    min: 1
  - name: setup-skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?plane-kanban-setup"'
    min: 0
    max: 0
