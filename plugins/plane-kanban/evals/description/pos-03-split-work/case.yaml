schema_version: "1.1"
name: pos-03-split-work
description: 大きい仕事を複数タスクに分けて進めたい依頼で plane-kanban が発動するか
tags: [description, positive]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 認証まわりの改修を進めたい。設計、実装、テストの3つに分けてやっていこうと思う。
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
runs: 3
graders:
  - name: kanban-skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?plane-kanban"'
    min: 1
  - name: setup-skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?plane-kanban-setup"'
    min: 0
    max: 0
