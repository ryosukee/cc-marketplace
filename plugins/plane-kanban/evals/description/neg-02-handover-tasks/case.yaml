schema_version: "1.1"
name: neg-02-handover-tasks
description: 引き継ぎ資料の未着手タスクを箇条書きにさせるだけの依頼で、どちらの skill も発動しないこと
tags: [description, negative, boundary]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 引き継ぎ資料に書いてある未着手のタスクを箇条書きでまとめて出して。
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
runs: 3
graders:
  - name: kanban-skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?plane-kanban"'
    min: 0
    max: 0
  - name: setup-skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?plane-kanban-setup"'
    min: 0
    max: 0
