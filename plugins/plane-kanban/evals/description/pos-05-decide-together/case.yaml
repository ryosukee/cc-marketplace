schema_version: "1.1"
name: pos-05-decide-together
description: 置き場を決める作業を始めさせつつ最終判断は自分がすると言う依頼で plane-kanban が発動するか
tags: [description, positive]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: notes の置き場を決める件、いまから進めておいて。ただ、最終的にどこにするかは自分で決めたいから、候補が出たところで止めて。
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
runs: 3
graders:
  - name: kanban-skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?plane-kanban"'
    min: 1
  - name: setup-skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?plane-kanban-setup"'
    min: 0
    max: 0
