schema_version: "1.1"
name: rule-06-single-project
description: project をまたいだ一覧を作らず、いまの repo に対応する project だけを見るか
tags: [behavior]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: plane-kanban のskillを使って、いまのrepoに関わっている作業の一覧を全部見せて。
  max_turns: 16
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
runs: 2
graders:
  - name: other-project-untouched
    type: regex
    target: { source: file, path: .fake-plane/requests.log }
    pattern: 'p-other'
    match: not_contains
