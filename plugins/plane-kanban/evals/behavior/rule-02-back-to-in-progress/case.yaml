schema_version: "1.1"
name: rule-02-back-to-in-progress
description: Needs Input で待っている work item が、返答を受けて再開するときに In Progress へ戻るか
tags: [behavior]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: plane-kanban のskillを使って、さっき確認を求められていたnotesの置き場の件、srcの下に置くことにしたから、その方針で作業を再開して。
  max_turns: 16
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
runs: 2
graders:
  - name: back-to-in-progress
    type: regex
    target: { source: file, path: .fake-plane/requests.log }
    pattern: 'PATCH /projects/p-eval/work-items/w3/ .*"state":"s3"'
    match: contains
