schema_version: "1.1"
name: rule-04-advance-on-start
description: 着手したカードを In Progress へ進めるか
tags: [behavior]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: plane-kanban のskillを使って、READMEの誤字を直す作業に今から着手するので、状態を更新しておいて。
  max_turns: 16
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
runs: 2
graders:
  - name: moved-to-in-progress
    type: regex
    target: { source: file, path: .fake-plane/requests.log }
    pattern: 'PATCH /projects/p-eval/work-items/w2/ .*"state":"s3"'
    match: contains
