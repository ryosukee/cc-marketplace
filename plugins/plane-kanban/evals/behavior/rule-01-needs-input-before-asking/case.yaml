schema_version: "1.1"
name: rule-01-needs-input-before-asking
description: 進行中の work item についてユーザーに確認を出す前に Needs Input へ動かすか
tags: [behavior]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: plane-kanban の skill を使って、notes の置き場を決める作業を進めてほしい。置き場の候補が複数あるなら、決める前にどれがいいか私に確認して。
  max_turns: 16
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
runs: 2
graders:
  - name: moved-to-needs-input
    type: regex
    target: { source: file, path: .fake-plane/requests.log }
    pattern: 'PATCH /projects/p-eval/work-items/w3/ .*"state":"s6"'
    match: contains
  - name: ends-with-a-question
    type: llm
    criteria: "PASS if the final reply asks the user which option to take. FAIL if it decides without asking or contains no question."
