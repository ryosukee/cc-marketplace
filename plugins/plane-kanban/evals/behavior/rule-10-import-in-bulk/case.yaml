schema_version: "1.1"
name: rule-10-import-in-bulk
description: 複数件をまとめて登録するとき、取り込み一覧の JSON を書いて一括で取り込むか
tags: [behavior]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: plane-kanban のskillを使って、次の3件をまとめてTodoに登録して。①ログイン画面のバリデーション修正、②パスワードリセットのメール文面の見直し、③ログイン失敗時のエラーメッセージ改善。
  max_turns: 16
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
runs: 2
graders:
  - name: three-items-created
    type: regex
    target: { source: file, path: .fake-plane/requests.log }
    pattern: '^POST /projects/p-eval/work-items/ '
    flags: m
    match: "count:3"
  - name: used-import-script
    type: tool_used
    tool: Bash
    input_match: 'import-work-items\.sh'
    min: 1
