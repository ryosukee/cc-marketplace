schema_version: "1.1"
name: rule-07-guide-to-setup
description: project が未設定なとき、project を作らず setup skill を案内するか
tags: [behavior]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: plane-kanban のskillを使って、いま担当している作業の一覧を見せて。
  max_turns: 16
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
runs: 2
graders:
  - name: no-project-created
    type: regex
    target: { source: file, path: .fake-plane/requests.log }
    pattern: '^POST /projects/ '
    flags: m
    match: not_contains
  - name: guides-to-setup
    type: regex
    target: last_message
    pattern: 'plane-kanban-setup'
    match: contains
