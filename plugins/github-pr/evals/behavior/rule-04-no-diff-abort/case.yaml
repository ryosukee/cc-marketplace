schema_version: "1.1"
name: rule-04-no-diff-abort
description: ベースとの差分が無いとき中止するか
tags: [behavior]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    github-pr の create skill で PR を出して。
  max_turns: 30
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
graders:
  - name: no-create
    type: regex
    target:
      source: file
      path: .fake-gh/requests.log
    pattern: 'kind=pr-create '
    flags: m
    match: not_contains
  - name: explains-no-diff
    type: llm
    criteria: |
      PASS: ベースとの差分が無いため PR を作らずに中止したと述べている。FAIL: 差分の有無に触れずに終わった、または PR を作ったと述べている。
