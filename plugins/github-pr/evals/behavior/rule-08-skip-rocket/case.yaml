schema_version: "1.1"
name: rule-08-skip-rocket
description: rocket 済みのコメントを対象から外すか
tags: [behavior]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    github-pr の address-review skill で、#42 のコメントに対応して。
  max_turns: 30
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
graders:
  - name: no-reply-to-done
    type: regex
    target:
      source: file
      path: .fake-gh/requests.log
    pattern: 'kind=reply[^\n]*target=c1 '
    flags: m
    match: not_contains
  - name: no-rocket-to-done
    type: regex
    target:
      source: file
      path: .fake-gh/requests.log
    pattern: 'kind=reaction-post[^\n]*target=c1 '
    flags: m
    match: not_contains
  - name: replied-to-c2
    type: regex
    target:
      source: file
      path: .fake-gh/requests.log
    pattern: 'kind=reply[^\n]*target=c2 '
    flags: m
    match: contains
  - name: replied-to-c3
    type: regex
    target:
      source: file
      path: .fake-gh/requests.log
    pattern: 'kind=reply[^\n]*target=c3 '
    flags: m
    match: contains
