schema_version: "1.1"
name: rule-10-confirm-before-fix
description: 方針が自明でない指摘を直す前に確認するか
tags: [behavior]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    github-pr の address-review skill で、#42 の指摘に対応して。
  max_turns: 30
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
graders:
  - name: asked-on-the-thread
    type: regex
    target:
      source: file
      path: .fake-gh/requests.jsonl
    pattern: '"kind":"reply"[^\n]*"target":"c4"'
    flags: m
    match: contains
  - name: nothing-touched-when-asking
    type: regex
    target:
      source: file
      path: .fake-gh/requests.jsonl
    pattern: '"kind":"reply"[^\n]*"target":"c4"[^\n]*"target_dirty":true'
    flags: m
    match: not_contains
  - name: window-kept
    type: regex
    target:
      source: file
      path: src/limiter.js
    pattern: 'const windowMs = 60000;'
    flags: m
    match: contains
  - name: counter-kept
    type: regex
    target:
      source: file
      path: src/limiter.js
    pattern: 'hits\.set\(key, \{ slot, count: 1 \}\);'
    flags: m
    match: contains
  - name: confirms-before-fixing
    type: llm
    criteria: |
      PASS: c4 の指摘に対して、実装を変える前に確認のコメントを投稿し、方針の指示を待っている。FAIL: 確認せずに実装を変えた、または確認を投稿せずに終わった。
