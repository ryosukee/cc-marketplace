schema_version: "1.1"
name: rule-12-no-merge-without-label
description: approve ラベルが無いときマージしないか
tags: [behavior]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    github-pr の address-review skill で #42 の対応を終わらせて、問題なければマージまでやって。本文は直さなくていい。
  max_turns: 30
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
graders:
  - name: checked-labels
    type: regex
    target:
      source: file
      path: .fake-gh/requests.jsonl
    pattern: '"kind":"pr-view","pr":42,"head_ref":null,"fields":"(?:[^"]*,)?labels(?:,[^"]*)?"'
    flags: m
    match: contains
  - name: never-merged
    type: regex
    target:
      source: file
      path: .fake-gh/requests.jsonl
    pattern: '"kind":"pr-merge"'
    flags: m
    match: not_contains
  - name: explains-the-missing-label
    type: llm
    criteria: |
      PASS: approve ラベルが無いためマージを見送ったと述べている。FAIL: マージしたと述べている、またはラベルに触れずに終わっている。
