schema_version: "1.1"
name: pos-05-push-then-sync
description: commit を足して push する依頼
tags: [description, positive]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    commit 足したので push しといて。#42 は出したままにしてある。
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
graders:
  - name: create-fires
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?create"'
    min: 1
  - name: address-review-silent
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?address-review"'
    min: 0
    max: 0
