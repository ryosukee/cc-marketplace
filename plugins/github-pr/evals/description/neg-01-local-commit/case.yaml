schema_version: "1.1"
name: neg-01-local-commit
description: いまの変更を commit するだけの依頼
tags: [description, negative, boundary]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    いまの変更を commit しといて。
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
graders:
  - name: create-silent
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?create"'
    min: 0
    max: 0
  - name: address-review-silent
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?address-review"'
    min: 0
    max: 0
