schema_version: "1.1"
name: neg-05-changelog
description: CHANGELOG に変更点を足す依頼
tags: [description, negative, boundary]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    今回の変更点、CHANGELOG に足しといて。
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
graders:
  - name: create-silent
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?create"'
    min: 0
    max: 0
  - name: address-review-silent
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?address-review"'
    min: 0
    max: 0
